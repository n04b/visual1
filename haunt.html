<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mighty Haunt</title>
<style>
  :root { --bg:#0c0c0c; --panel:#161616; --fg:#ddd; --dim:#777; --acc:#f0902e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font: 12px/1.4 ui-monospace, Menlo, monospace; }
  body { display:flex; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; min-width:0; overflow:auto; }
  canvas { image-rendering: pixelated; cursor:pointer; box-shadow:0 0 0 1px #1c1c1c; }
  #panel { width:280px; background:var(--panel); padding:14px; overflow-y:auto; border-left:1px solid #222; }
  h1 { font-size:13px; margin:0 0 10px; letter-spacing:.08em; text-transform:uppercase; }
  .row { display:grid; grid-template-columns: 78px 1fr 44px; align-items:center; gap:6px; margin:5px 0; }
  .row label { color:var(--dim); }
  .row output { text-align:right; color:var(--fg); }
  input[type=range] { width:100%; accent-color:var(--acc); }
  input[type=text], select, textarea { width:100%; background:#0c0c0c; color:var(--fg);
    border:1px solid #333; padding:4px 6px; font:inherit; }
  textarea { resize:vertical; text-transform:uppercase; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  button { flex:1; background:#222; color:var(--fg); border:1px solid #333; padding:7px 8px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  .sub { color:var(--dim); margin:12px 0 4px; }
  .checks { display:flex; flex-wrap:wrap; gap:4px 12px; }
  .checks label { color:var(--dim); display:flex; align-items:center; gap:4px; cursor:pointer; }
  .checks input { accent-color:var(--acc); margin:0; }
  #status { color:var(--dim); margin-top:10px; }
  .hint { color:#555; margin-top:12px; }
  @media (max-width: 700px) { body { flex-direction:column; } #panel { width:100%; } }
</style>
</head>

<div id="stage"><canvas id="cv"></canvas></div>
<div id="panel">
  <h1>Mighty Haunt · карты</h1>
  <div class="row"><label>seed</label><input type="text" id="seed"><button id="bDice" title="R">🎲</button></div>
  <div class="btns">
    <button id="bNew" title="Space">new</button>
    <button id="bSave" title="S">save png</button>
  </div>
  <div id="controls"></div>
  <div class="row"><label>язык</label><select id="lang"><option value="en">EN</option><option value="ru">RU</option></select><span></span></div>
  <div class="sub">названия (строка = глава)</div>
  <textarea id="titles" rows="3" spellcheck="false"></textarea>
  <div class="sub">биомы</div>
  <div class="checks" id="biomes"></div>
  <div class="sub">детали</div>
  <div class="checks" id="flags"></div>
  <div id="status"></div>
  <div class="hint">
    Space / клик — новая карта<br>
    R — новый seed · S — сохранить PNG<br><br>
    ☺ старт · ☹ / ! босс · 🔒 замок и ключ где-то в тупике ·
    пунктир — тайные тропы · портал в лаве, орда черепов в топи
  </div>
</div>

// ---------- rng / noise ----------
function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
  return (h ^ h >>> 16) >>> 0;
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const randSeed = () => Math.random().toString(36).slice(2, 8);
function makeNoise(seed) {
  const h = (x, y) => { let n = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ seed;
    n = Math.imul(n ^ n >>> 13, 1274126177); return ((n ^ n >>> 16) >>> 0) / 4294967296; };
  const sm = t => t * t * (3 - 2 * t);
  const v = (x, y) => { const ix = Math.floor(x), iy = Math.floor(y), fx = sm(x - ix), fy = sm(y - iy);
    const a = h(ix, iy), b = h(ix + 1, iy), c = h(ix, iy + 1), d = h(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy; };
  return (x, y) => v(x, y) * 0.6 + v(x * 2.1 + 17, y * 2.1 + 5) * 0.28 + v(x * 4.3 + 3, y * 4.3 + 31) * 0.12;
}
const clamp01 = t => Math.max(0, Math.min(1, t));

const CODE = { '#': 1, '+': 2, '*': 3, 'o': 9 };
function parseGlyph(src) {
  const rows = src.trim().split(/\s+/), h = rows.length, w = rows[0].length, d = new Uint8Array(w * h);
  rows.forEach((r, y) => { for (let x = 0; x < w; x++) d[y * w + x] = CODE[r[x]] || 0; });
  return { w, h, d };
}
function xform(g, fx, fy, tr) {
  const w = tr ? g.h : g.w, h = tr ? g.w : g.h, d = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let sx = tr ? y : x, sy = tr ? x : y;
    if (fx) sx = g.w - 1 - sx;
    if (fy) sy = g.h - 1 - sy;
    d[y * w + x] = g.d[sy * g.w + sx];
  }
  return { w, h, d };
}
const GL = {};
for (const k in GLYPH_SRC) GL[k] = parseGlyph(GLYPH_SRC[k]);

// corner pieces keyed by connection mask (N=1 E=2 S=4 W=8); pC connects S+E

const CORNER_DOT = {};
for (const m in CORNER) { // dotted corner = the middle of the solid arc
  const g = CORNER[m], d = g.d.slice();
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if (x < 3 || x > 6 || y < 3 || y > 6) d[y * 8 + x] = 0;
  CORNER_DOT[m] = { w: 8, h: 8, d };
}

function wrap(s, max) { // greedy on short lines: THE / MIGHTY / HAUNT, A MUCH / MIGHTIER / HAUNT
  const lines = []; let cur = '';
  for (const w of s.trim().toUpperCase().split(/\s+/).filter(Boolean)) {
    if (!cur) cur = w; else if ((cur + ' ' + w).length <= max) cur += ' ' + w; else { lines.push(cur); cur = w; }

  if (cur) lines.push(cur);
  return lines;
}

    }
    if (!ok) continue;
    for (let yy = 0; yy < chh; yy++) for (let xx = 0; xx < cw; xx++) {
      const j = idx(x + xx, y + yy);
      occ[j] = yy > 0 && STACK[it[0]] ? 2 : 1; itemCell[j] = 1;
    }
    items.push({ g: it[0], x, y, pal: it[2] || B.pal });
  }

  return { cols, rows, W, H, N, seeds, chs, bio, reserved, nodeAt, pathAt, pmask, nodes, edges,
    enc, horde, structs, items, gl, gpatch, itemCell, compass, labels };
}

// ---------- render ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let M = null;

function render() {
  const { W, H, cols, N } = M;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const img = ctx.createImageData(W, H), buf = new Uint32Array(img.data.buffer);
  buf.fill(BLACK);
  const px = (x, y, c) => { if (x >= 0 && y >= 0 && x < W && y < H) buf[y * W + x] = c; };
  const rect = (x, y, w, h, c) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) px(xx, yy, c); };
  const blit = (g, ox, oy, pal) => {
    const P = pal.map(col);
    for (let y = 0; y < g.h; y++) for (let x = 0; x < g.w; x++) {
      const v = g.d[y * g.w + x];
      if (v) px(ox + x, oy + y, v === 9 ? BLACK : P[v - 1] ?? P[0]);
    }
  };
  const text = (s, x, y, c) => {
    const C = col(c);
    for (const ch of s) {
      if (ch === ' ') { x += 4; continue; }
      const g = FONT[ch] || FONT['?'];
      for (let r = 0; r < 7; r++) for (let q = 0; q < 7; q++) if (g[r][q] === '#') px(x + q, y + r, C);
      x += 8;
    }
  };

  // ground dithers
  for (let i = 0; i < N; i++) {
    if (!M.gl[i] || M.pathAt[i] >= 0 || M.nodeAt[i] >= 0 || M.reserved[i]) continue;
    const B = BIOMES[M.seeds[M.bio[i]].b];
    if (B.clear && M.itemCell[i]) continue;
    const gp = M.gpatch[i] ? B.ground.patch : null;
    const pat = PAT[gp ? gp.pat : B.ground.pat[M.gl[i] - 1]], C = col(gp ? gp.c : B.ground.c);
    const x0 = (i % cols) * 8, y0 = ((i / cols) | 0) * 8;
    for (let y = y0; y < y0 + 8; y++) for (let x = x0; x < x0 + 8; x++) if (pat(x, y)) buf[y * W + x] = C;
  }
  for (const it of M.items) blit(GL[it.g], it.x * 8, it.y * 8, it.pal);
  for (const s of M.structs) blit(GL[s.g], s.x * 8, s.y * 8, s.pal);

  // roads
  for (let i = 0; i < N; i++) {
    const e = M.pathAt[i];
    if (e < 0 || M.enc.get(i) === 'quest') continue;
    const st = M.edges[e].style, m = M.pmask[i], straight = m === 5 || m === 10;
    const g = st === 'dash' ? GL.pDash : st === 'dot' ? (straight ? GL.pDot : CORNER_DOT[m])
      : m === 5 ? GL.pV : m === 10 ? GL.pH : CORNER[m];
    if (g) blit(g, (i % cols) * 8, ((i / cols) | 0) * 8, [WHITE]);
  }
  const Wc = col(WHITE);
  for (const n of M.nodes) {
    if (n.icon === 'none') continue;
    const x0 = n.x * 8, y0 = n.y * 8;
    if (!NO_STUB[n.icon]) for (let d = 0; d < 4; d++) {
      const e = n.conn[d];
      if (e < 0 || M.edges[e].style !== 'solid') continue;
      if (d === 0) rect(x0 + 3, y0, 2, 4, Wc); else if (d === 1) rect(x0 + 4, y0 + 3, 4, 2, Wc);
      else if (d === 2) rect(x0 + 3, y0 + 4, 2, 4, Wc); else rect(x0, y0 + 3, 4, 2, Wc);
    }
    blit(GL[n.icon], x0, y0, [WHITE]);
  }
  for (const [i, k] of M.enc) blit(GL[k], (i % cols) * 8, ((i / cols) | 0) * 8, [WHITE]);
  for (const [x, y] of M.horde) blit(GL.skull, x * 8, y * 8, [RED]);

  // compass rose
  if (M.compass) {
    const { x: cx, y: cy } = M.compass;
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) if (Math.abs(dx) + Math.abs(dy) <= 3) px(cx + dx, cy + dy, Wc);
    for (let d = 0; d < 4; d++) {
      for (let k = 4; k <= 9; k++) px(cx + DX[d] * k, cy + DY[d] * k, Wc);
      px(cx + DX[d] * 8 + DY[d], cy + DY[d] * 8 + DX[d], Wc);
      px(cx + DX[d] * 8 - DY[d], cy + DY[d] * 8 - DX[d], Wc);
    }
    text('N', cx - 3, cy - 18, WHITE); text('S', cx - 3, cy + 12, WHITE);
    text('W', cx - 19, cy - 3, WHITE); text('E', cx + 12, cy - 3, WHITE);
  }

  // title boxes
  const titles = titlesInp.value.split('\n');
  M.labels.forEach((L, c) => {
    const lines = wrap(titles[c] || '', 6);
    if (!lines.length) lines.push('');
    const tw = Math.max(0, ...lines.map(textW)), len = Math.max(76, tw + 26);
    const xr = W - 34, x0 = xr - len, y0 = L.y0, bh = lines.length * 8 + 11, G = col(GREY);
    rect(x0 + 2, y0, len - 2, 2, G); rect(x0 + 2, y0 + bh - 2, len - 2, 2, G);
    rect(x0, y0 + 2, 2, bh - 4, G); px(x0 + 1, y0 + 1, G); px(x0 + 1, y0 + bh - 2, G);
    for (let x = xr + 6; x < W - 1; x += 8) { rect(x, y0, 2, 2, G); rect(x, y0 + bh - 2, 2, 2, G); }
    lines.forEach((l, k) => text(l, x0 + 8, y0 + 6 + k * 8, WHITE));
    const rt = ratings[c] || { stars: 5, skulls: 3 };
    const row = (n, g, c2, y) => {
      let x = x0 + 5;
      for (let k = 0; k < n; k++, x += 8) blit(g, x, y, [c2]);
      for (x += 3; x < W - 1; x += 8) rect(x, y + 3, 2, 2, G);
    };
    row(rt.stars, GL.star, GOLD, y0 + bh + 4);
    row(rt.skulls, GL.skull, RED, y0 + bh + 14);
  });

  ctx.putImageData(img, 0, 0);
  fit();
}

function fit() {
  const st = document.getElementById('stage');
  const aw = st.clientWidth - 40, ah = st.clientHeight - 40;
  let s = Math.min(aw / cv.width, ah / cv.height);
  if (s >= 2) s = Math.floor(s);
  s = Math.max(0.25, s);
  cv.style.width = cv.width * s + 'px'; cv.style.height = cv.height * s + 'px';
}

// ---------- ui ----------
const P = { chapters: 1, cols: 40, spacing: 4, fill: 0.6, loops: 2, enc: 0.35, biomesPer: 4, rag: 0.5, jitter: 0.5,
  scale: 3, lang: 'en', compass: true, labels: true, structs: true, lock: true };
const defs = [
  ['chapters', 'главы', 1, 3, 1], ['cols', 'ширина', 28, 64, 1], ['biomesPer', 'биомов в главе', 1, 6, 1],
  ['spacing', 'шаг узлов', 3, 7, 1], ['fill', 'ветвистость', 0.2, 1, 0.05], ['loops', 'тайные тропы', 0, 6, 1],
  ['enc', 'события', 0, 1, 0.05], ['jitter', 'кривизна', 0, 1, 0.05], ['rag', 'рваные края', 0, 1, 0.05],
  ['scale', 'масштаб png', 1, 8, 1],
];
const box = document.getElementById('controls');
for (const [k, label, min, max, step] of defs) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${P[k]}"><output>${P[k]}</output>`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  inp.oninput = () => { P[k] = +inp.value; out.textContent = inp.value; if (k !== 'scale') regen(); };
  box.appendChild(row);
}
const enabledBiomes = new Set(Object.keys(BIOMES));
const bBox = document.getElementById('biomes');
for (const k in BIOMES) {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" checked>${BIOMES[k].ru}`;
  const cb = l.querySelector('input');
  cb.onchange = () => {
    if (cb.checked) enabledBiomes.add(k); else if (enabledBiomes.size > 1) enabledBiomes.delete(k); else cb.checked = true;
    regen();
  };
  bBox.appendChild(l);
}
const fBox = document.getElementById('flags');
for (const [k, label] of [['compass', 'компас'], ['labels', 'названия'], ['structs', 'порталы, орды'], ['lock', 'замки']]) {
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" ${P[k] ? 'checked' : ''}>${label}`;
  const cb = l.querySelector('input');
  cb.onchange = () => { P[k] = cb.checked; regen(); };
  fBox.appendChild(l);
}

const seedInp = document.getElementById('seed'), titlesInp = document.getElementById('titles');
const langSel = document.getElementById('lang'), status = document.getElementById('status');
let seed = randSeed(), ratings = [], titlesDirty = false;
seedInp.value = seed;

function syncTitles(force) {
  const gen = genTitles(seed, P.chapters, P.lang);
  ratings = gen.ratings;
  if (force || !titlesDirty) { titlesInp.value = gen.titles.join('\n'); titlesDirty = false; return; }
  const cur = titlesInp.value.split('\n');
  while (cur.length < P.chapters) cur.push(gen.titles[cur.length]);
  titlesInp.value = cur.join('\n');
}
let lastChapters = P.chapters;
function regen() {
  if (P.chapters !== lastChapters) { lastChapters = P.chapters; syncTitles(false); }
  M = generate({ ...P, seed, biomes: [...enabledBiomes] });
  render();
  status.innerHTML = `${M.cols}×${M.rows} · узлов ${M.nodes.length} · дорог ${M.edges.length}<br>` +
    M.chs.map((ch, i) => `${i + 1}: ${ch.seeds.map(s => BIOMES[s.b].ru).join(', ')}`).join('<br>');
}
function newMap() { seed = randSeed(); seedInp.value = seed; syncTitles(true); regen(); }
function download(canvas, name) {
  const a = document.createElement('a'); a.download = name; a.href = canvas.toDataURL('image/png'); a.click();
}
function save() {
  const c = document.createElement('canvas'), s = P.scale;
  c.width = cv.width * s; c.height = cv.height * s;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.drawImage(cv, 0, 0, c.width, c.height);
  download(c, `haunt-${seed}.png`);
}

seedInp.onchange = () => { seed = seedInp.value; syncTitles(true); regen(); };
langSel.onchange = () => { P.lang = langSel.value; syncTitles(true); render(); };
titlesInp.oninput = () => { titlesDirty = true; render(); };
cv.addEventListener('click', newMap);
document.getElementById('bNew').onclick = newMap;
document.getElementById('bDice').onclick = newMap;
document.getElementById('bSave').onclick = save;
addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && e.target.type === 'text')) return;
  if (e.code === 'Space') { e.preventDefault(); newMap(); }
  else if (e.code === 'KeyR') newMap();
  else if (e.code === 'KeyS') save();
});
addEventListener('resize', () => M && fit());

syncTitles(true);
regen();
</script>
</body>
