<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TAU = Math.PI * 2;
const V3 = THREE.Vector3;

// ---------- random ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;
const R = (a = 1, b) => b === undefined ? rng() * a : a + rng() * (b - a);
const RI = (a, b) => Math.floor(R(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
const gauss = () => (rng() + rng() + rng() + rng() - 2) / 2; // ~[-1, 1], bell-shaped
const sm = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

// periodic noise over [0, TAU), range ~[-1, 1]
function pnoise(k = 4) {
  const a = [], p = [];
  for (let i = 1; i <= k; i++) { a.push(R(0.3, 1) / i); p.push(R(TAU)); }
  const s = a.reduce((x, y) => x + y);
  return th => { let v = 0; for (let i = 0; i < k; i++) v += a[i] * Math.sin((i + 1) * th + p[i]); return v / s; };
}

// ---------- palette ----------
const hsl = (h, s, l) => new THREE.Color().setHSL(h / 360, s / 100, l / 100);
const BASE = {
  pink: [330, 100, 72], magenta: [312, 95, 62], hot: [336, 100, 58], red: [2, 100, 52],
  orange: [24, 100, 55], amber: [42, 100, 58], yellow: [57, 95, 60], lime: [92, 90, 55],
  green: [138, 85, 48], teal: [170, 75, 52], cyan: [188, 95, 62], sky: [198, 100, 78],
  blue: [218, 95, 56], deep: [232, 90, 42], violet: [266, 90, 68], lilac: [290, 80, 78],
  white: [200, 70, 94],
};
let P = {}, mood = 'classic', hueBase = {};
const wrap = d => ((d % 360) + 540) % 360 - 180;
// each seed gets a colour mood; every palette slot is then remapped through it
const MOODS = {
  classic: () => (h, sa, l) => [h, sa, l],
  shift: () => { const d = R(40, 320); return (h, sa, l) => [h + d, sa, l]; },
  family: () => { const c = R(360), k = R(0.15, 0.4); return (h, sa, l) => [c + wrap(h - c) * k, sa, l]; },
  pastel: () => { const d = R(-40, 40); return (h, sa, l) => [h + d, sa * 0.55, Math.min(90, l + 16)]; },
  acid: () => { const d = R(360); return (h, sa, l) => [h * 1.7 + d, 100, 52 + (l - 60) * 0.3]; },
  duo: () => { const A = R(360), B = A + R(130, 210); return (h, sa, l) => { const c = Math.abs(wrap(h - A)) < Math.abs(wrap(h - B)) ? A : B; return [c + wrap(h - c) * 0.2, sa, l]; }; },
  triad: () => { const A = R(360), T = [A, A + 120, A + 240]; return (h, sa, l) => { const c = T.reduce((x, y) => Math.abs(wrap(h - y)) < Math.abs(wrap(h - x)) ? y : x); return [c + wrap(h - c) * 0.15, sa, l]; }; },
  random: () => { const m = {}; return (h, sa, l) => [(m[h] ??= R(360)), R(70, 100), l + R(-8, 8)]; },
  mono: () => { const c = R(360), acc = c + 180; return (h, sa, l) => rng() < 0.12 ? [acc, 100, 60] : [c + R(-12, 12), sa * R(0.6, 1), l + R(-18, 12)]; },
  fire: () => (h, sa, l) => [wrap(h) * 0.16 + 18, 100, l],
  ice: () => (h, sa, l) => [200 + wrap(h - 200) * 0.22, sa * 0.85, Math.min(92, l + 6)],
  forest: () => (h, sa, l) => [110 + wrap(h - 110) * 0.3, sa * 0.8, l - 4],
  candy: () => (h, sa, l) => [320 + wrap(h - 320) * 0.35, 90, Math.min(88, l + 8)],
  sunset: () => (h, sa, l) => { const t = (wrap(h) + 180) / 360; return [260 + t * 150, 95, l]; },
  inverse: () => (h, sa, l) => [h + 180, sa, l],
};
function makePalette() {
  mood = pick(['classic', 'classic', 'shift', 'shift', 'family', 'family', 'pastel', 'acid', 'duo', 'triad', 'triad', 'random', 'random', 'mono', 'fire', 'ice', 'forest', 'candy', 'sunset', 'inverse']);
  const fn = MOODS[mood](), whiteHue = R(360), whiteSat = R(0, 70);
  hueBase = {};
  for (const [name, [h, sa, l]] of Object.entries(BASE)) {
    if (name === 'white') { hueBase.white = [whiteHue, whiteSat, 93]; continue; }
    const [H, S, L] = fn(h, sa, l);
    hueBase[name] = [H + R(-10, 10), Math.max(0, Math.min(100, S)), Math.max(30, Math.min(92, L))];
  }
  localPalette(0);
}
// per-organism hue drift, so two organisms of the same kind rarely match
function localPalette(drift) {
  P = {};
  for (const [name, [h, sa, l]] of Object.entries(hueBase))
    P[name] = hsl((((name === 'white' ? h : h + drift) % 360) + 360) % 360, sa, l);
}
const mix = (a, b, t) => a.clone().lerp(b, t);

// ---------- geometry buffers ----------
let PP, PC, PS, LP, LC, dotK = 1;
function reset() { PP = []; PC = []; PS = []; LP = []; LC = []; }
function dot(p, c, size, a = 1) { PP.push(p.x, p.y, p.z); PC.push(c.r * a, c.g * a, c.b * a); PS.push(size * dotK); }
function seg(p, q, c1, c2, a = 1) {
  LP.push(p.x, p.y, p.z, q.x, q.y, q.z);
  LC.push(c1.r * a, c1.g * a, c1.b * a, c2.r * a, c2.g * a, c2.b * a);
}
function strip(pts, colAt, a) {
  const n = pts.length - 1;
  let prev = colAt(0);
  for (let i = 0; i < n; i++) { const c = colAt((i + 1) / n); seg(pts[i], pts[i + 1], prev, c, a); prev = c; }
}
function resample(pts, step) {
  const out = [pts[0].clone()];
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    let a = pts[i - 1], b = pts[i], d = a.distanceTo(b);
    while (acc + d >= step) {
      const p = a.clone().lerp(b, (step - acc) / d);
      out.push(p); a = p; d = a.distanceTo(b); acc = 0;
    }
    acc += d;
  }
  return out;
}
function bezier(p0, p1, p2, p3, n) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    out.push(new V3()
      .addScaledVector(p0, u * u * u).addScaledVector(p1, 3 * u * u * t)
      .addScaledVector(p2, 3 * u * t * t).addScaledVector(p3, t * t * t));
  }
  return out;
}

// local tangent frame on the unit sphere; (u, v) are geodesic offsets in radians
function makeFrame(n, rot, h0) {
  n = n.clone().normalize();
  const ref = Math.abs(n.y) < 0.9 ? new V3(0, 1, 0) : new V3(1, 0, 0);
  const a = new V3().crossVectors(ref, n).normalize();
  const b = new V3().crossVectors(n, a);
  const t1 = a.clone().multiplyScalar(Math.cos(rot)).addScaledVector(b, Math.sin(rot));
  const t2 = new V3().crossVectors(n, t1);
  return { n, t1, t2, h0 };
}
function S2(f, u, v, h = 0) {
  const a = Math.hypot(u, v), d = f.n.clone();
  if (a > 1e-7) d.multiplyScalar(Math.cos(a)).addScaledVector(f.t1, Math.sin(a) * u / a).addScaledVector(f.t2, Math.sin(a) * v / a);
  return d.multiplyScalar(1 + f.h0 + h);
}

// double-helix bead chain along a 3D polyline
function chain(pts, cA, cB, w, { size = 2.6, a = 0.9, twist = 0.33, rung = P.red, rungA = 0.5, period = 60 } = {}) {
  const n = pts.length, ph = R(TAU);
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const T = pts[Math.min(i + 1, n - 1)].clone().sub(pts[Math.max(i - 1, 0)]).normalize();
    const N = new V3().crossVectors(T, p);
    if (N.lengthSq() < 1e-8) N.set(0, 1, 0).cross(T);
    N.normalize();
    const o = Math.sin(i * twist + ph) * w;
    const p1 = p.clone().addScaledVector(N, o), p2 = p.clone().addScaledVector(N, -o);
    const t = Math.sin(i / period * TAU) * 0.5 + 0.5;
    dot(p1, mix(cA, cB, t), size, a);
    dot(p2, mix(cB, cA, t), size, a);
    if (i % 3 === 0) seg(p1, p2, rung, rung, rungA);
  }
}
function blob(center, rad, cols, count, size = 1.6, a = 0.7) {
  for (let i = 0; i < count; i++) dot(center.clone().add(rand3(rad)), pick(cols), R(size * 0.6, size * 1.3), a * 0.35);
}

// ---------- organisms ----------
const G = {
  nebula(f, s) {
    const core = pick([P.red, P.orange, P.hot]), core2 = pick([P.red, P.amber, P.magenta]);
    const shell = pick([P.blue, P.sky, P.cyan]), shell2 = pick([P.deep, P.teal, P.blue]);
    const rim = pick([P.cyan, P.white, P.teal, P.lime]);
    const ex = R(0.8, 1.25), nz = pnoise(5), nz2 = pnoise(3);
    const N = Math.floor(52000 * s * s / 0.25);
    for (let i = 0; i < N; i++) {
      const th = R(TAU), e = 1 + 0.12 * nz(th), r = Math.sqrt(rng());
      const x = Math.cos(th) * r * e * s * ex, y = Math.sin(th) * r * e * s / ex;
      const tc = 1 - sm(0.42, 0.62 + 0.08 * nz2(th), r);
      const c = rng() < tc ? mix(core, core2, rng() * 0.6) : mix(shell, shell2, rng());
      dot(S2(f, x, y, 0.12 * s * (1 - r * r)), c, R(1.2, 2.6), 0.55);
    }
    for (let k = 0; k < 26; k++) { // swirls in the core
      const rr = R(0.12, 0.55) * s, a0 = R(TAU), span = R(1, 3.5), cx = gauss() * 0.1 * s, cy = gauss() * 0.1 * s, pts = [];
      for (let j = 0; j <= 30; j++) { const a = a0 + span * j / 30; pts.push(S2(f, cx + Math.cos(a) * rr * ex, cy + Math.sin(a) * rr / ex, 0.12 * s)); }
      strip(pts, t => mix(P.amber, core, t), 0.5);
    }
    const nr = Math.floor(2600 * s);
    for (let i = 0; i < nr; i++) {
      const th = R(TAU), e = 1 + 0.12 * nz(th), r = R(1.02, 1.32) * e;
      dot(S2(f, Math.cos(th) * r * s * ex, Math.sin(th) * r * s / ex), mix(rim, P.white, rng() * 0.4), R(1.6, 3.2), 0.9);
    }
    for (let i = 0; i < 900; i++) {
      const th = R(TAU), e = 1 + 0.12 * nz(th), r0 = R(0.55, 0.9), r1 = R(1.05, 1.4), dth = R(-0.2, 0.2), pts = [];
      for (let j = 0; j <= 6; j++) {
        const t = j / 6, r = (r0 + (r1 - r0) * t) * e, a = th + dth * t * t;
        pts.push(S2(f, Math.cos(a) * r * s * ex, Math.sin(a) * r * s / ex, 0.04 * s * (1 - t)));
      }
      strip(pts, t => mix(shell, rim, t), 0.35);
    }
    // crest
    const ca = R(TAU), cc = S2(f, Math.cos(ca) * s * 1.15 * ex, Math.sin(ca) * s * 1.15 / ex, 0.03);
    blob(cc, s * 0.09, [P.green, P.lime, P.cyan, P.white], 2200, 1.8, 0.6);
    return { col: rim, col2: core };
  },

  disk(f, s) {
    const c1 = pick([P.sky, P.white, P.cyan]);
    const nz = pnoise(6), k = RI(8, 18), ph = R(1);
    const edge = th => 1 + 0.025 * nz(th) - ((th / TAU * k + ph) % 1 < 0.14 ? 0.07 : 0);
    const ri = rng() < 0.35 ? R(0.35, 0.75) : 0; // sometimes a ring instead of a full disk
    const N = Math.floor(46000 * s * s / 0.09 * (1 - ri * ri));
    for (let i = 0; i < N; i++) {
      const th = R(TAU), r = Math.sqrt(R(ri * ri, 1)) * edge(th);
      dot(S2(f, Math.cos(th) * r * s, Math.sin(th) * r * s, 0.015), mix(c1, P.white, rng() * 0.6), R(1, 2.2), 0.4);
    }
    const phi0 = R(TAU), spread = R(0.4, 1.2), cor = [P.pink, P.violet, P.lilac, P.amber, P.magenta];
    for (let i = 0; i < 3500; i++) {
      const th = phi0 + gauss() * spread, r = 1 + Math.pow(rng(), 2) * R(0.2, 0.9);
      dot(S2(f, Math.cos(th) * r * s, Math.sin(th) * r * s), pick(cor), R(1, 2), 0.5);
    }
    for (let i = 0; i < 220; i++) {
      const th = phi0 + gauss() * spread, L = R(0.2, 1), c = pick(cor), pts = [];
      for (let j = 0; j <= 8; j++) { const r = 0.9 + L * j / 8; pts.push(S2(f, Math.cos(th + j * 0.02) * r * s, Math.sin(th + j * 0.02) * r * s)); }
      strip(pts, t => mix(c, P.white, 1 - t), 0.45);
    }
    return { col: c1, col2: pick(cor) };
  },

  necklace(f, s) {
    const closed = rng() < 0.55, p2 = [], ex = R(0.75, 1.3);
    if (closed) {
      const nz = pnoise(5);
      for (let j = 0; j <= 700; j++) { const th = j / 700 * TAU, r = s * (0.72 + 0.3 * nz(th)); p2.push([Math.cos(th) * r * ex, Math.sin(th) * r / ex]); }
    } else {
      let x = 0, y = 0, h = R(TAU), dh = 0;
      for (let j = 0; j < 520; j++) {
        dh = dh * 0.94 + gauss() * 0.05; h += dh;
        const r = Math.hypot(x, y);

    chain(pts, cA, cB, 0.011, { size: 2.6 });
    for (let i = 0; i < 220; i++) { // web
      const a = pick(pts), b = pick(pts), m = a.clone().add(b).multiplyScalar(0.5).multiplyScalar(0.97);
      strip(bezier(a, a.clone().lerp(m, 0.7), b.clone().lerp(m, 0.7), b, 10), t => mix(P.red, P.hot, t), 0.22);
    }
    if (closed) {
      for (let k = RI(2, 6); k > 0; k--) {
        const cx = gauss() * s * 0.4, cy = gauss() * s * 0.4, rr = s * R(0.06, 0.12), loop = [];
        for (let j = 0; j <= 60; j++) { const a = j / 60 * TAU; loop.push(S2(f, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * R(0.9, 1.1), 0.03)); }

      }

  },

  fan(f, s) {
    const c1 = pick([P.pink, P.hot, P.magenta]), c2 = pick([P.yellow, P.amber, P.white]), c3 = pick([P.lime, P.green, P.teal, P.cyan]);
    const phi0 = R(TAU), spread = rng() < 0.25 ? Math.PI : R(0.4, 1.4), K = RI(45, spread === Math.PI ? 160 : 100), bend = R(-0.6, 0.6);

        pts.push(S2(f, u0 + Math.cos(an) * r, v0 + Math.sin(an) * r, 0.05 * Math.sin(t * Math.PI) * s));

      strip(pts, t => mix(c1, c2, t), 0.6);
      const tip = pts[14], an = a + bend, tu = u0 + Math.cos(an) * L, tv = v0 + Math.sin(an) * L;
      for (let q = 0; q < 9; q++) { const b = q / 9 * TAU; dot(S2(f, tu + Math.cos(b) * 0.014, tv + Math.sin(b) * 0.014), P.white, 2, 0.95); }
      dot(tip, c2, 3, 0.6);
    }
    for (let ri = RI(2, 4); ri > 0; ri--) {
      const rr = s * L0 * R(0.25, 0.85), rows = RI(1, 3), col = rng() < 0.5 ? c3 : c1;
      const cnt = Math.floor(rr * spread * 2 / 0.008);

        dot(S2(f, u0 + Math.cos(a) * r, v0 + Math.sin(a) * r, 0.02), mix(col, P.white, R(0.2)), R(2.4, 3.4), 0.9);

  },

  rosette(f, s) {

    for (let j = 0; j <= 600; j++) { const th = j / 600 * TAU * 2, r = s * 0.6 * Math.cos(k / 2 * th); pts.push(S2(f, Math.cos(th) * r, Math.sin(th) * r, 0.05 * s)); }
    strip(pts, t => mix(cols[1], P.white, Math.abs(Math.sin(t * TAU * k))), 0.55);
    const no = Math.floor(TAU * s / 0.01);
    for (let j = 0; j < no; j++) {
      const th = j / no * TAU, r0 = s * 1.08, r1 = s * R(1.15, 1.35);
      seg(S2(f, Math.cos(th) * r0, Math.sin(th) * r0), S2(f, Math.cos(th) * r1, Math.sin(th) * r1), cols[0], P.white, 0.5);
      dot(S2(f, Math.cos(th) * r1, Math.sin(th) * r1), cols[0], 2, 0.8);
    }
    blob(S2(f, 0, 0, 0.05 * s), s * 0.1, [P.yellow, P.white, cols[1], P.cyan], 1500, 1.8, 0.7);
    return { col: cols[0], col2: cols[1] };
  },

  maze(f, s) {
    const n = RI(9, 14), shape = RI(0, 2);
    const mask = (x, y) => shape === 0 ? x * x + y * y < 0.95 : shape === 1 ? Math.abs(x) + Math.abs(y) < 1.02

    const stack = [start]; seen.add(key(...start));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 0, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false; controls.minDistance = 1.3; controls.maxDistance = 8;
controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
controls.rotateSpeed = 0.6;

const U = { uTime: { value: 0 }, uFade: { value: 0 }, uPR: { value: renderer.getPixelRatio() }, uScale: { value: 1 } };
const depthGLSL = `
  float depthFade(vec4 mv) {
    float cz = (viewMatrix * vec4(0.0, 0.0, 0.0, 1.0)).z;
    return mix(0.2, 1.0, smoothstep(-0.95, 0.75, mv.z - cz));
  }`;
const pointMat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 acol; attribute float asize;
    uniform float uTime, uFade, uPR, uScale;
    varying vec3 vColor;
    ${depthGLSL}
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float h = fract(sin(dot(position, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
      float tw = 0.8 + 0.3 * sin(uTime * (0.8 + h * 2.2) + h * 60.0);
      vColor = acol * depthFade(mv) * uFade * 0.8;
      gl_PointSize = asize * uPR * uScale * tw * (3.6 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if (d > 1.0) discard;
      float a = smoothstep(1.0, 0.7, d);
      gl_FragColor = vec4(vColor * a, 1.0);
    }`,
});
const lineMat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 acol; uniform float uFade; varying vec3 vColor;
    ${depthGLSL}
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vColor = acol * depthFade(mv) * uFade * 0.6;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `varying vec3 vColor; void main() { gl_FragColor = vec4(vColor, 1.0); }`,
});

function flush(group) {
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.Float32BufferAttribute(PP, 3));
  pg.setAttribute('acol', new THREE.Float32BufferAttribute(PC, 3));
  pg.setAttribute('asize', new THREE.Float32BufferAttribute(PS, 1));
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(LP, 3));
  lg.setAttribute('acol', new THREE.Float32BufferAttribute(LC, 3));
  group.add(new THREE.LineSegments(lg, lineMat), new THREE.Points(pg, pointMat));
  reset();
}

let world = null, hubGroup = null, seed = 0;
function generate(newSeed) {
  seed = newSeed >>> 0;
  rng = mulberry32(seed);
  history.replaceState(null, '', '#' + seed);
  if (world) { world.traverse(o => o.geometry && o.geometry.dispose()); scene.remove(world); }
  world = new THREE.Group(); hubGroup = new THREE.Group();
  world.add(hubGroup);

  makePalette();
  dotK = R(0.8, 1.3);
  reset();
  const hub = buildHub();
  flush(hubGroup);

  // pick organisms and place them on the sphere without overlap
  // random weights per seed: some spheres are dominated by a few kinds of organisms
  const names = Object.keys(G), weights = names.map(() => Math.pow(rng(), 2.5));
  const wsum = weights.reduce((a, b) => a + b);
  const wpick = () => { let r = R(wsum); for (let i = 0; i < names.length; i++) if ((r -= weights[i]) <= 0) return names[i]; return names[0]; };
  const count = RI(8, 22), sizeK = R(0.8, 1.2) * Math.sqrt(13 / count);
  const types = [];
  for (let i = 0; i < count; i++) types.push(rng() < 0.35 ? pick(names) : wpick());
  const list = types.map(t => ({ t, s: R(...SIZES[t]) * sizeK, inner: rng() < 0.18 })).sort((a, b) => b.s - a.s);

  // placement: uniform, bunched into a band, or crowded toward one pole
  const layout = pick(['uniform', 'uniform', 'band', 'cap']), axis = randUnit();
  const randDir = () => {
    const v = randUnit();
    if (layout === 'band') return v.addScaledVector(axis, -v.dot(axis) * R(0.4, 0.8)).normalize();
    if (layout === 'cap' && v.dot(axis) < 0 && rng() < 0.7) v.addScaledVector(axis, -2 * v.dot(axis));
    return v;
  };
  const placed = [];
  for (const it of list) {
    let n, s = it.s, ok = false;
    const peers = placed.filter(p => p.inner === it.inner);
    for (let tries = 0; tries < 400 && !ok; tries++) {
      n = randDir();
      ok = peers.every(p => n.angleTo(p.n) > (s + p.s) * 1.02);
      if (tries % 80 === 79) s *= 0.9;
    }
    if (!ok) continue;
    const f = makeFrame(n, R(TAU), it.inner ? R(-0.4, -0.2) : R(-0.08, 0.05));
    localPalette(rng() < 0.6 ? R(-35, 35) : 0);
    const res = G[it.t](f, s);
    placed.push({ t: it.t, n, s, f, inner: it.inner, ...res });
  }

  localPalette(0);
  // connective tissue
  const link = R(0.15, 1.1);
  for (const c of placed) if (rng() < 0.55 * link) bundle(c, hub);
  for (let k = Math.floor(placed.length * R(0.4, 0.8) * link); k > 0; k--) {
    const a = pick(placed), b = pick(placed);
    if (a !== b) bundle(a, b);
  }
  orbitThreads();

  // dust
  for (let i = RI(1000, 9000); i > 0; i--) dot(randUnit().multiplyScalar(R(0.98, 1.03)), P.white, R(0.8, 1.4), 0.18);
  for (let i = 0; i < 1500; i++) dot(randUnit().multiplyScalar(Math.cbrt(rng()) * 0.95), pick([P.pink, P.cyan, P.white]), R(0.8, 1.6), 0.3);
  flush(world);

  scene.add(world);
  U.uFade.value = 0;
}


function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const d = w / h < 1 ? 3.6 / (w / h) * 0.9 : 3.6;
  camera.position.setLength(d);
  U.uScale.value = Math.min(h, w * 1.2) / 900;
}
addEventListener('resize', resize);
resize();

// ---------- input ----------
const hint = document.getElementById('hint');
renderer.domElement.addEventListener('dblclick', () => generate(Math.random() * 2 ** 32));
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); generate(Math.random() * 2 ** 32); }
  else if (e.code === 'KeyR') controls.autoRotate = !controls.autoRotate;
  else if (e.code === 'KeyH') hint.style.opacity = hint.style.opacity === '0' ? '1' : '0';
  else if (e.code === 'KeyS') {
    renderer.render(scene, camera);
    const a = document.createElement('a');
    a.download = `sphere-${seed}.png`;
    a.href = renderer.domElement.toDataURL('image/png');
    a.click();
  }
});

const fromHash = parseInt(location.hash.slice(1), 10);
generate(Number.isFinite(fromHash) ? fromHash : Math.random() * 2 ** 32);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  U.uTime.value += dt;
  U.uFade.value = Math.min(1, U.uFade.value + dt * 0.8);
  hubGroup.rotation.y += dt * 0.12; hubGroup.rotation.x += dt * 0.05;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
