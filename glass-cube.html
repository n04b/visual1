<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ---------- parameters ----------
const P = {
  sx:       { g: 'Форма',  label: 'Ширина',         min: 0.3,  max: 1.8,  step: 0.01, val: 1 },
  sy:       { g: 'Форма',  label: 'Высота',         min: 0.3,  max: 1.8,  step: 0.01, val: 1 },
  sz:       { g: 'Форма',  label: 'Глубина',        min: 0.3,  max: 1.8,  step: 0.01, val: 1 },
  bevel:    { g: 'Форма',  label: 'Скругление',     min: 0.005,max: 0.6,  step: 0.005,val: 0.06 },
  ior:      { g: 'Стекло', label: 'Преломление',    min: 1.05, max: 2.6,  step: 0.01, val: 1.55 },
  disp:     { g: 'Стекло', label: 'Дисперсия',      min: 0,    max: 0.35, step: 0.005,val: 0.08 },
  bounces:  { g: 'Стекло', label: 'Отражения внутри', min: 1,  max: 10,   step: 1,    val: 6, int: true },
  samples:  { g: 'Стекло', label: 'Длин волн',      min: 3,    max: 16,   step: 1,    val: 9, int: true },
  density:  { g: 'Стекло', label: 'Плотность цвета',min: 0,    max: 1.5,  step: 0.01, val: 0.12 },
  hue:      { g: 'Стекло', label: 'Оттенок',        min: 0,    max: 1,    step: 0.005,val: 0.68 },
  light:    { g: 'Свет',   label: 'Яркость',        min: 0,    max: 5,    step: 0.05, val: 1.7 },
  lsize:    { g: 'Свет',   label: 'Размер софтбоксов', min: 0.2, max: 2.5, step: 0.01, val: 1 },
  soft:     { g: 'Свет',   label: 'Мягкость краёв', min: 0,    max: 1,    step: 0.01, val: 0.18 },
  lyaw:     { g: 'Свет',   label: 'Азимут',         min: -180, max: 180,  step: 1,    val: 0 },
  lpitch:   { g: 'Свет',   label: 'Наклон',         min: -80,  max: 80,   step: 1,    val: 0 },
  orbit:    { g: 'Свет',   label: 'Орбита света',   min: 0,    max: 1,    step: 0.01, val: 0 },
  warm:     { g: 'Свет',   label: 'Температура',    min: -1,   max: 1,    step: 0.01, val: 0 },
  ambient:  { g: 'Свет',   label: 'Окружение',      min: 0,    max: 1,    step: 0.01, val: 0.15 },
  ring:     { g: 'Свет',   label: 'Кольцевой свет', min: 0,    max: 4,    step: 0.05, val: 1.2 },
  ringN:    { g: 'Свет',   label: 'Панели кольца',  min: 0,    max: 12,   step: 1,    val: 6, int: true },
  ringW:    { g: 'Свет',   label: 'Ширина кольца',  min: 0.03, max: 0.9,  step: 0.01, val: 0.3 },
  ringZ:    { g: 'Свет',   label: 'Кольцо: сдвиг',  min: -0.9, max: 0.9,  step: 0.01, val: -0.15 },
  scale:    { g: 'Кадр',   label: 'Дистанция',      min: 1.4,  max: 7,    step: 0.01, val: 2.9 },
  fov:      { g: 'Кадр',   label: 'Перспектива °',  min: 1,    max: 75,   step: 0.5,  val: 26 },
  exposure: { g: 'Кадр',   label: 'Экспозиция',     min: 0.2,  max: 3,    step: 0.01, val: 1 },
  bloom:    { g: 'Кадр',   label: 'Свечение',       min: 0,    max: 2,    step: 0.01, val: 0.55 },
  sat:      { g: 'Кадр',   label: 'Насыщенность',   min: 0,    max: 2.5,  step: 0.01, val: 1.2 },
  grain:    { g: 'Кадр',   label: 'Зерно',          min: 0,    max: 0.25, step: 0.005,val: 0.06 },
  spin:     { g: 'Кадр',   label: 'Автовращение',   min: 0,    max: 1,    step: 0.01, val: 0.18 },
  res:      { g: 'Кадр',   label: 'Разрешение',     min: 0.5,  max: 2,    step: 0.25, val: Math.min(devicePixelRatio, 2) },
};
const DEF = Object.fromEntries(Object.entries(P).map(([k, v]) => [k, v.val]));

// ---------- orientations ----------
const eulerQ = (x, y, z) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z, 'YXZ'));
// vertex (1,1,1) toward the camera, chosen local axis projected straight up → hexagon; then an optional tilt
function isoQ(upY, tx = 0, ty = 0, tz = 0){
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 1, 1).normalize(), new THREE.Vector3(0, 0, 1));
  const v = new THREE.Vector3(0, upY, 0).applyQuaternion(q);
  const roll = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2 - Math.atan2(v.y, v.x));
  return eulerQ(tx, ty, tz).multiply(roll.multiply(q));
}

const PRESETS = [
  { name: 'Призма', q: () => isoQ(1, 0.1, -0.12), p: {
    sx: 1, sy: 1, sz: 1, bevel: 0.07, ior: 1.52, disp: 0.22, bounces: 6, density: 0.45, hue: 0.7,
    light: 1.0, lsize: 0.8, soft: 0.4, lyaw: 0, lpitch: 0, warm: -0.2, ambient: 0.2,
    ring: 1.5, ringN: 6, ringW: 0.4, ringZ: -0.3,
    scale: 2.7, fov: 22, exposure: 1.0, bloom: 0.5, sat: 1.5, grain: 0.07, spin: 0.12 } },
  { name: 'Гекса', q: () => isoQ(-1), p: {
    sx: 1, sy: 1, sz: 1, bevel: 0.05, ior: 1.58, disp: 0.25, bounces: 7, density: 0.02, hue: 0.55,
    light: 1.4, lsize: 1.4, soft: 0.2, lyaw: 180, lpitch: 0, warm: 0.1, ambient: 0.1,
    ring: 1.3, ringN: 0, ringW: 0.3, ringZ: -0.1,
    scale: 2.15, fov: 4, exposure: 0.95, bloom: 0.4, sat: 1.5, grain: 0.04, spin: 0 } },
  { name: 'Дрейф', q: () => isoQ(1, 0.28, 0.35, 0.4), p: {
    sx: 1, sy: 1, sz: 1, bevel: 0.06, ior: 1.5, disp: 0.16, bounces: 6, density: 0.04, hue: 0.1,
    light: 1.4, lsize: 0.9, soft: 0.3, lyaw: -30, lpitch: 10, warm: 0.15, ambient: 0.12,
    ring: 1.2, ringN: 5, ringW: 0.3, ringZ: -0.2,
    scale: 4.2, fov: 34, exposure: 1.0, bloom: 0.55, sat: 1.35, grain: 0.07, spin: 0.3 } },
];

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
let pr = P.res.val;                        // live pixel ratio (adaptive, capped by 'res')
renderer.setPixelRatio(pr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// studio softboxes, defined in light space: direction, size (tangent-plane half extents), roll, intensity, color
const LIGHTS = [
  { d: [ 0.10,  0.96, -0.28], s: [0.62, 0.26], roll: 0,    i: 3.0, c: [1.00, 1.00, 1.00] }, // top key
  { d: [-0.92,  0.10, -0.38], s: [0.07, 0.95], roll: 0,    i: 2.6, c: [0.88, 0.93, 1.00] }, // left strip
  { d: [ 0.94,  0.12, -0.32], s: [0.09, 0.85], roll: 0,    i: 2.0, c: [1.00, 0.96, 0.90] }, // right strip
  { d: [ 0.00,  0.05, -1.00], s: [0.34, 0.20], roll: 0.2,  i: 1.4, c: [1.00, 1.00, 1.00] }, // back panel
  { d: [ 0.35,  0.55,  1.00], s: [0.45, 0.10], roll: -0.3, i: 0.9, c: [1.00, 1.00, 1.00] }, // front strip (face glints)
  { d: [-0.25, -0.95, -0.20], s: [0.40, 0.18], roll: 0,    i: 0.6, c: [0.95, 0.97, 1.00] }, // floor bounce
];
const NL = LIGHTS.length;
const lDir = [], lU = [], lV = [], lPar = [], lCol = [];
{
  const up = new THREE.Vector3(0, 1, 0), fw = new THREE.Vector3(0, 0, 1);
  for (const L of LIGHTS) {
    const d = new THREE.Vector3(...L.d).normalize();
    const ref = Math.abs(d.y) > 0.9 ? fw : up;
    const u = new THREE.Vector3().crossVectors(ref, d).normalize();
    const v = new THREE.Vector3().crossVectors(d, u);
    const c = Math.cos(L.roll), s = Math.sin(L.roll);
    lDir.push(d);
    lU.push(u.clone().multiplyScalar(c).addScaledVector(v, s));
    lV.push(v.clone().multiplyScalar(c).addScaledVector(u, -s));
    lPar.push(new THREE.Vector3(L.s[0], L.s[1], L.i));
    lCol.push(new THREE.Vector3(...L.c));
  }
}

const U = {
  uRes:      { value: new THREE.Vector2() },
  uRot:      { value: new THREE.Matrix3() },
  uRotInv:   { value: new THREE.Matrix3() },
  uEnv:      { value: new THREE.Matrix3() },
  uHalf:     { value: new THREE.Vector3(1, 1, 1) },
  uRad:      { value: 0.06 },
  uTanHalf:  { value: 0.2 },
  uDist:     { value: 10 },
  uIOR:      { value: 1.55 },
  uDisp:     { value: 0.08 },
  uSigma:    { value: new THREE.Vector3() },
  uBounces:  { value: 6 },
  uSamples:  { value: 9 },
  uFrame:    { value: 0 },
  uLight:    { value: 1.7 },
  uLSize:    { value: 1 },
  uSoft:     { value: 0.18 },
  uWarm:     { value: new THREE.Vector3(1, 1, 1) },
  uAmbient:  { value: 0.15 },
  uRing:     { value: new THREE.Vector4(1.2, 6, 0.3, -0.15) },
  uExposure: { value: 1 },
  uSat:      { value: 1.2 },
  uLDir:     { value: lDir },
  uLU:       { value: lU },
  uLV:       { value: lV },
  uLPar:     { value: lPar },
  uLCol:     { value: lCol },
};

const frag = /* glsl */`
precision highp float;
#define NL ${NL}
#define MAXB 10
#define MAXS 16
uniform vec2 uRes;
uniform mat3 uRot, uRotInv, uEnv;
uniform vec3 uHalf, uSigma, uWarm;
uniform float uRad, uTanHalf, uDist, uIOR, uDisp, uLight, uLSize, uSoft, uAmbient, uExposure, uSat;
uniform vec4 uRing; // intensity, panel count, band half-width, band centre along the view axis
uniform int uBounces, uSamples, uFrame;
uniform vec3 uLDir[NL], uLU[NL], uLV[NL], uLPar[NL], uLCol[NL];

// ---- rounded box: exact SDF + analytic normal ----
float sdRB(vec3 p){
  vec3 q = abs(p) - (uHalf - uRad);
  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - uRad;
}
vec3 nRB(vec3 p){
  vec3 b = uHalf - uRad;
  vec3 d = p - clamp(p, -b, b);
  float l = length(d);
  if(l > 1e-6) return d / l;
  vec3 a = abs(p) - b;
  return a.x > a.y && a.x > a.z ? vec3(sign(p.x), 0.0, 0.0)
       : a.y > a.z ? vec3(0.0, sign(p.y), 0.0) : vec3(0.0, 0.0, sign(p.z));
}
vec3 safeDir(vec3 d){ return d + vec3(equal(d, vec3(0.0))) * 1e-7; }

// entry: slab test on a slightly padded hull, then sphere-trace onto the rounded surface.
// Rays that miss by less than a pixel still count, with partial coverage → antialiased silhouette.
bool hitRB(vec3 ro, vec3 rd, float pixA, out float t, out float cov){
  vec3 h = uHalf + uDist * pixA * 2.0;
  vec3 inv = 1.0 / safeDir(rd);
  vec3 a = (-h - ro) * inv, b = (h - ro) * inv;
  vec3 mn = min(a, b), mx = max(a, b);
  float t0 = max(max(mn.x, mn.y), mn.z), t1 = min(min(mx.x, mx.y), mx.z);
  t = max(t0, 0.0);
  cov = 1.0;
  if(t1 < t) return false;
  float minA = 1e9, tMin = t;
  for(int i = 0; i < 64; i++){
    float d = sdRB(ro + rd * t);
    if(d < 2e-5) return true;
    float ang = d / max(t, 1e-3);
    if(ang < minA){ minA = ang; tMin = t; }
    t += d;
    if(t > t1) break;
  }
  if(minA >= pixA) return false;
  t = tMin;
  cov = 1.0 - minA / pixA;
  return true;
}
// exit from inside: far plane of the sharp hull, then Newton back onto the rounded surface.
// The SDF is convex along the ray, so Newton from the outside converges monotonically to the exit.
float exitRB(vec3 p, vec3 d){
  vec3 inv = 1.0 / safeDir(d);
  vec3 tt = max((-uHalf - p) * inv, (uHalf - p) * inv);
  float t = min(min(tt.x, tt.y), tt.z);
  for(int k = 0; k < 6; k++){
    vec3 q = p + d * t;
    float s = sdRB(q);
    if(s < 1e-5) break;
    t -= s / max(dot(d, nRB(q)), 0.03);
  }
  return max(t, 0.0);
}

float fresnel(float ci, float n1, float n2){
  float st2 = (n1 / n2) * (n1 / n2) * (1.0 - ci * ci);
  if(st2 >= 1.0) return 1.0;
  float ct = sqrt(1.0 - st2);
  float rs = (n1 * ci - n2 * ct) / (n1 * ci + n2 * ct);
  float rp = (n1 * ct - n2 * ci) / (n1 * ct + n2 * ci);
  return 0.5 * (rs * rs + rp * rp);
}

// ---- studio environment: rectangular softboxes on black ----
vec3 env(vec3 dw){
  vec3 d = uEnv * dw;
  vec3 c = mix(vec3(0.010, 0.011, 0.018), vec3(0.055, 0.06, 0.085), smoothstep(-0.4, 1.0, d.y)) * uAmbient;
  float soft = 0.003 + uSoft * uSoft * 0.3;
  for(int i = 0; i < NL; i++){
    float cz = dot(d, uLDir[i]);
    if(cz <= 0.02) continue;
    vec2 pp = vec2(dot(d, uLU[i]), dot(d, uLV[i])) / cz;
    vec2 hs = uLPar[i].xy * uLSize;
    vec2 q = abs(pp) - hs;
    float sd = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0);
    float m = 1.0 - smoothstep(-soft, soft, sd);
    // softbox falloff: slightly hotter centre
    float core = 1.0 - 0.35 * dot(pp / (hs + soft), pp / (hs + soft));
    c += uLCol[i] * (m * uLPar[i].z * max(core, 0.3));
  }
  // ring of panels around the view axis: side light that only reaches the eye after refraction / TIR
  if(uRing.x > 0.0){
    float band = 1.0 - smoothstep(uRing.z - soft, uRing.z + soft, abs(d.z - uRing.w));
    float pnl = 1.0;
    if(uRing.y > 0.5){
      float f = fract(atan(d.y, d.x) / 6.2831853 * uRing.y + 0.25);
      float e = 0.004 + uSoft * uSoft * 0.2;
      pnl = smoothstep(0.09 - e, 0.09 + e, f) * (1.0 - smoothstep(0.91 - e, 0.91 + e, f));
    }
    c += vec3(0.96, 0.97, 1.0) * band * pnl * uRing.x;
  }
  return c * uLight * uWarm;
}

// wavelength (0..1 over 400–700nm) → RGB, Zucconi's 6-bump fit
vec3 bump3y(vec3 x, vec3 yo){ vec3 y = 1.0 - x * x; return clamp(y - yo, 0.0, 1.0); }
vec3 spectral(float x){
  const vec3 c1 = vec3(3.54585104, 2.93225262, 2.41593945);
  const vec3 x1 = vec3(0.69549072, 0.49228336, 0.27699880);
  const vec3 y1 = vec3(0.02312639, 0.15225084, 0.52607955);
  const vec3 c2 = vec3(3.90307140, 3.21182957, 3.96587128);
  const vec3 x2 = vec3(0.11748627, 0.86755042, 0.66077860);
  const vec3 y2 = vec3(0.84897130, 0.88445281, 0.73949448);
  return bump3y(c1 * (x - x1), y1) + bump3y(c2 * (x - x2), y2);
}

// one wavelength through the glass: at every internal hit part of the light leaves, the rest reflects
vec3 transmit(vec3 p, vec3 rd, vec3 n, float eta, float sig){
  vec3 dir = refract(rd, n, 1.0 / eta);
  vec3 pos = p;
  float w = 1.0;
  vec3 L = vec3(0.0);
  for(int b = 0; b < MAXB; b++){
    if(b >= uBounces) break;
    float t = exitRB(pos, dir);
    vec3 hp = pos + dir * t;
    vec3 on = nRB(hp);
    w *= exp(-sig * t);
    float ci = max(dot(dir, on), 1e-4);
    float F = fresnel(ci, eta, 1.0);
    if(F < 1.0){
      vec3 od = refract(dir, -on, eta);
      L += w * (1.0 - F) * env(uRot * od);
    }
    w *= F;
    if(w < 0.006) break;
    dir = reflect(dir, on);
    pos = hp;
  }
  return L;
}

void main(){
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
  vec3 roW = vec3(0.0, 0.0, uDist);
  vec3 rdW = normalize(vec3(uv * uTanHalf, -1.0));
  vec3 ro = uRotInv * roW, rd = uRotInv * rdW;

  float t, cov;
  if(!hitRB(ro, rd, 2.0 * uTanHalf / uRes.y, t, cov)){ gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }

  vec3 p = ro + rd * t;
  vec3 n = nRB(p);
  p -= n * sdRB(p);                        // snap near-miss points onto the surface
  float ci = clamp(-dot(rd, n), 0.0, 1.0);
  float F = fresnel(ci, 1.0, uIOR);
  vec3 col = F * env(uRot * reflect(rd, n));

  // stratified spectral sampling, jittered per pixel & frame
  // interleaved gradient noise + golden-ratio frame offset: grain-like, far less clumpy than white noise
  float jit = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))) + float(uFrame % 1024) * 0.618034);
  const float K0 = 3.30579, KN = 3.50617; // 1/0.55², (1/0.42² − 1/0.68²)
  vec3 acc = vec3(0.0), wsum = vec3(0.0);
  float fs = float(uSamples);
  for(int i = 0; i < MAXS; i++){
    if(i >= uSamples) break;
    float x = (float(i) + jit) / fs;
    vec3 sw = spectral(x);
    float um = 0.4 + 0.3 * x;
    // Cauchy-shaped curve, blended toward linear so the red side of the fringe isn't squashed
    float eta = uIOR + uDisp * mix((1.0 / (um * um) - K0) / KN, 0.5 - x, 0.5);
    float sig = dot(uSigma, sw) / (sw.r + sw.g + sw.b + 1e-4);
    acc += transmit(p, rd, n, max(eta, 1.01), sig) * sw;
    wsum += sw;
  }
  vec3 tr = acc / max(wsum, vec3(1e-4));
  float lum = dot(tr, vec3(0.2126, 0.7152, 0.0722));
  tr = max(mix(vec3(lum), tr, uSat), 0.0);

  col = (col + (1.0 - F) * tr) * uExposure * cov;
  // roll off hot peaks logarithmically so big lit faces don't flood the bloom
  float pk = max(col.r, max(col.g, col.b));
  if(pk > 1.2) col *= (1.2 + log(pk - 0.2)) / pk;
  gl_FragColor = vec4(col, 1.0);
}
`;

const mat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: frag,
  depthTest: false, depthWrite: false,
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

// ---------- post ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0, 0.9);
// tight glow: starve the widest mips so a lit face doesn't fog the whole frame
bloom.compositeMaterial.uniforms.bloomFactors.value = [1.0, 0.6, 0.25, 0.07, 0.015];
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uGrain: { value: 0.06 }, uSeed: { value: 0 }, uRes: { value: new THREE.Vector2() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uGrain, uSeed; uniform vec2 uRes; varying vec2 vUv;
    float h(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      vec2 q = vUv - 0.5; q.x *= uRes.x / uRes.y;
      c *= 1.0 - 0.35 * smoothstep(0.35, 1.1, length(q));
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      float g = h(gl_FragCoord.xy + uSeed) + h(gl_FragCoord.xy * 1.37 - uSeed) - 1.0;
      c += g * uGrain * (0.35 + 0.65 * (1.0 - l));
      c += uGrain * 0.12;                       // lifted film black
      gl_FragColor = vec4(c, 1.0);
    }`,
});
composer.addPass(finish);

// ---------- orientation & motion ----------
const q = PRESETS[0].q();
const m4 = new THREE.Matrix4();
const envM = new THREE.Matrix4(), envE = new THREE.Euler();
let orbitAngle = 0;
function syncRot(){
  m4.makeRotationFromQuaternion(q);
  U.uRot.value.setFromMatrix4(m4);
  U.uRotInv.value.copy(U.uRot.value).transpose();
  // world → light space
  envE.set(THREE.MathUtils.degToRad(P.lpitch.val), THREE.MathUtils.degToRad(P.lyaw.val) + orbitAngle, 0, 'YXZ');
  envM.makeRotationFromEuler(envE).invert();
  U.uEnv.value.setFromMatrix4(envM);
}

const el = renderer.domElement;
const pointers = new Map();
let drag = false, px = 0, py = 0, pinchD = 0, lastMove = 0;
const vel = new THREE.Vector2();          // angular velocity, rad/s (around world y, x)
const _q = new THREE.Quaternion(), _ax = new THREE.Vector3();
function rotateBy(ax, ay){                // ax: around world Y, ay: around world X
  const a = Math.hypot(ax, ay);
  if (a < 1e-7) return;
  _ax.set(ay / a, ax / a, 0);
  _q.setFromAxisAngle(_ax, a);
  q.premultiply(_q).normalize();
}
el.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  el.setPointerCapture(e.pointerId);
  if (pointers.size === 1) { drag = true; px = e.clientX; py = e.clientY; vel.set(0, 0); lastMove = performance.now(); el.classList.add('drag'); }
  if (pointers.size === 2) { drag = false; const [a, b] = [...pointers.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); }
  hideHint();
});
const endPtr = e => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    drag = false; el.classList.remove('drag');
    if (performance.now() - lastMove > 90) vel.set(0, 0);
  }
};
el.addEventListener('pointerup', endPtr);
el.addEventListener('pointercancel', endPtr);
el.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD > 0) setZoom(P.scale.val * pinchD / d);
    pinchD = d;
    return;
  }
  if (!drag) return;
  const now = performance.now();
  const dt = Math.max(1, now - lastMove) / 1000; lastMove = now;
  const k = 2.6 / Math.min(innerWidth, innerHeight) * Math.PI * 0.5;
  const ax = (e.clientX - px) * k, ay = (e.clientY - py) * k;
  px = e.clientX; py = e.clientY;
  rotateBy(ax, ay);
  vel.lerp(new THREE.Vector2(ax / dt, ay / dt), 0.5);
});
el.addEventListener('wheel', e => {
  e.preventDefault();
  setZoom(P.scale.val * Math.exp(e.deltaY * 0.0012));
}, { passive: false });
function setZoom(v){
  P.scale.val = Math.min(P.scale.max, Math.max(P.scale.min, v));
  apply('scale');
}

// ---------- apply params ----------
function hsl(h, s, l){ return new THREE.Color().setHSL(h, s, l); }
function apply(k){
  const v = P[k].val;
  switch (k) {
    case 'sx': case 'sy': case 'sz': case 'bevel': {
      U.uHalf.value.set(P.sx.val, P.sy.val, P.sz.val);
      U.uRad.value = Math.min(P.bevel.val, Math.min(P.sx.val, P.sy.val, P.sz.val) - 0.002);
      break;
    }
    case 'ior': U.uIOR.value = v; break;
    case 'disp': U.uDisp.value = v; break;
    case 'bounces': U.uBounces.value = v; break;
    case 'samples': U.uSamples.value = v; break;
    case 'density': case 'hue': {
      // colour that survives absorption → Beer–Lambert coefficients
      const c = hsl(P.hue.val, 0.75, 0.55);
      const d = P.density.val;
      U.uSigma.value.set(-Math.log(Math.max(c.r, 0.02)) * d, -Math.log(Math.max(c.g, 0.02)) * d, -Math.log(Math.max(c.b, 0.02)) * d);
      break;
    }
    case 'light': U.uLight.value = v; break;
    case 'lsize': U.uLSize.value = v; break;
    case 'soft': U.uSoft.value = v; break;
    case 'warm': {
      const w = v;
      U.uWarm.value.set(1 + 0.18 * w, 1 + 0.02 * w, 1 - 0.28 * w);
      break;
    }
    case 'ambient': U.uAmbient.value = v; break;
    case 'ring': case 'ringN': case 'ringW': case 'ringZ':
      U.uRing.value.set(P.ring.val, P.ringN.val, P.ringW.val, P.ringZ.val); break;
    case 'scale': case 'fov': {
      const th = Math.tan(THREE.MathUtils.degToRad(P.fov.val) / 2);
      U.uTanHalf.value = th;
      U.uDist.value = P.scale.val / th;
      break;
    }
    case 'exposure': U.uExposure.value = v; break;
    case 'bloom': bloom.strength = v; break;
    case 'sat': U.uSat.value = v; break;
    case 'grain': finish.uniforms.uGrain.value = v; break;
    case 'res': pr = v; renderer.setPixelRatio(pr); resize(); break;
  }
  if (refs[k]) syncUI(k);
  saveHash();
}

// ---------- UI ----------
const controls = document.getElementById('controls');
const refs = {};
const groups = {};
for (const [k, s] of Object.entries(P)) {
  if (!groups[s.g]) {
    const det = document.createElement('details');
    if (s.g !== 'Кадр') det.open = true;
    const sum = document.createElement('summary'); sum.textContent = s.g;
    det.appendChild(sum); controls.appendChild(det);
    groups[s.g] = det;
  }
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label');
  const val = document.createElement('b');
  lab.textContent = s.label; lab.appendChild(val);
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = s.min; inp.max = s.max; inp.step = s.step; inp.value = s.val;
  inp.addEventListener('input', () => { s.val = parseFloat(inp.value); apply(k); markPreset(-1); });
  inp.addEventListener('dblclick', () => { s.val = DEF[k]; apply(k); });
  row.append(lab, inp); groups[s.g].appendChild(row);
  refs[k] = { inp, val };
}
function fmt(k, v){ return P[k].int ? String(v) : Math.abs(P[k].step) >= 1 ? String(Math.round(v)) : v.toFixed(2); }
function syncUI(k){ refs[k].inp.value = P[k].val; refs[k].val.textContent = fmt(k, P[k].val); }

const presetBox = document.getElementById('presets');
const presetBtns = PRESETS.map((pr, i) => {
  const b = document.createElement('button'); b.textContent = pr.name;
  b.addEventListener('click', () => loadPreset(i));
  presetBox.appendChild(b); return b;
});
function markPreset(i){ presetBtns.forEach((b, j) => b.classList.toggle('on', i === j)); }
function loadPreset(i){
  const pr = PRESETS[i];
  for (const k of Object.keys(P)) if (k !== 'res') { P[k].val = pr.p[k] ?? DEF[k]; }
  for (const k of Object.keys(P)) apply(k);
  q.copy(pr.q()); vel.set(0, 0); orbitAngle = 0;
  markPreset(i);
}

const R = (a, b) => a + Math.random() * (b - a);
function randomize(){
  const cube = Math.random() < 0.6;
  const base = R(0.75, 1.15);
  P.sx.val = cube ? 1 : base * R(0.55, 1.5);
  P.sy.val = cube ? 1 : base * R(0.55, 1.5);
  P.sz.val = cube ? 1 : base * R(0.55, 1.5);
  P.bevel.val = Math.random() < 0.8 ? R(0.02, 0.14) : R(0.2, 0.45);
  P.ior.val = R(1.4, 2.1);
  P.disp.val = R(0.03, 0.18);
  P.density.val = Math.random() < 0.5 ? R(0, 0.08) : R(0.15, 0.7);
  P.hue.val = Math.random();
  P.light.val = R(1.3, 2.6);
  P.lsize.val = R(0.6, 1.8);
  P.soft.val = R(0.05, 0.45);
  P.lyaw.val = Math.round(R(-180, 180));
  P.lpitch.val = Math.round(R(-30, 30));
  P.warm.val = R(-0.5, 0.5);
  for (const k of ['sx','sy','sz','bevel','ior','disp','density','hue','light','lsize','soft','lyaw','lpitch','warm']) apply(k);
  q.setFromEuler(new THREE.Euler(R(-1.2, 1.2), R(-Math.PI, Math.PI), R(-0.5, 0.5), 'YXZ'));
  markPreset(-1);
}

// URL hash keeps the current look shareable
let hashT = 0, booting = true;
function saveHash(){
  if (booting) return;
  clearTimeout(hashT);
  hashT = setTimeout(() => {
    const o = Object.fromEntries(Object.keys(P).filter(k => k !== 'res').map(k => [k, +P[k].val.toFixed(3)]));
    o.q = q.toArray().map(x => +x.toFixed(4));
    history.replaceState(null, '', '#' + encodeURIComponent(JSON.stringify(o)));
  }, 250);
}
function loadHash(){
  try {
    const o = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    for (const k of Object.keys(P)) if (typeof o[k] === 'number') P[k].val = o[k];
    if (Array.isArray(o.q) && o.q.length === 4) q.fromArray(o.q).normalize();
    return true;
  } catch { return false; }
}

const panel = document.getElementById('panel');
const hint = document.getElementById('hint');
const togglePanel = () => panel.classList.toggle('hidden');
document.getElementById('toggle').addEventListener('click', togglePanel);
document.getElementById('rnd').addEventListener('click', randomize);
document.getElementById('reset').addEventListener('click', () => loadPreset(0));
document.getElementById('png').addEventListener('click', savePNG);
if (innerWidth < 560) panel.classList.add('hidden');
function savePNG(){
  el.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'glass-cube.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
}
let hintOff = false;
function hideHint(){ if (!hintOff) { hintOff = true; hint.style.opacity = '0'; } }
setTimeout(hideHint, 7000);

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  const k = e.key.toLowerCase();
  if (k === 'h' || k === 'р') togglePanel();
  else if (k === ' ') { e.preventDefault(); randomize(); }
  else if (k === 's' || k === 'ы') savePNG();
  else if (k === '1' || k === '2' || k === '3') loadPreset(+k - 1);
});

// ---------- boot ----------
if (location.hash.length > 1 && loadHash()) {
  for (const k of Object.keys(P)) apply(k);
  markPreset(-1);
} else {
  loadPreset(0);
}
booting = false;

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth, innerHeight);
  renderer.getDrawingBufferSize(U.uRes.value);
  finish.uniforms.uRes.value.copy(U.uRes.value);
}
addEventListener('resize', resize);
resize();

// ---------- adaptive resolution: 'res' is the ceiling, drop while frames are slow ----------
let ftAvg = 16, prT = 0;
function adapt(dtMs, now){
  ftAvg += (dtMs - ftAvg) * 0.08;
  if (now - prT < 700) return;
  let next = pr;
  if (ftAvg > 26 && pr > 0.5) next = Math.max(0.5, pr * 0.85);
  else if (ftAvg < 15 && pr < P.res.val) next = Math.min(P.res.val, pr * 1.1);
  if (Math.abs(next - pr) > 0.02) { pr = next; prT = now; renderer.setPixelRatio(pr); resize(); }
}

// ---------- loop ----------
const spinAxis = new THREE.Vector3(0.18, 1, 0.06).normalize();
const spinQ = new THREE.Quaternion();
let last = performance.now(), frame = 0, idle = 0;
function tick(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  if (frame > 10 && !document.hidden) adapt(now - last, now);
  last = now;
  if (!drag) {
    if (vel.lengthSq() > 1e-6) {
      rotateBy(vel.x * dt, vel.y * dt);
      vel.multiplyScalar(Math.exp(-dt * 2.2));
      idle = 0;
    } else idle += dt;
    // auto-spin eases back in after interaction
    const s = P.spin.val * Math.min(1, Math.max(0, idle - 1.2) / 2);
    if (s > 0) { spinQ.setFromAxisAngle(spinAxis, s * dt * 0.6); q.premultiply(spinQ).normalize(); }
  } else idle = 0;
  orbitAngle += P.orbit.val * dt * 0.8;
  if (drag || vel.lengthSq() > 1e-6) saveHash();
  syncRot();
  U.uFrame.value = frame++;
  finish.uniforms.uSeed.value = (frame % 256) * 17.13;
  composer.render();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
