  body { display:flex; }
  #stage { flex:1; position:relative; min-width:0; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 42%, #262626, #121212 72%); }
  #cv { display:block; cursor:pointer; box-shadow: 0 22px 60px rgba(0,0,0,.6), 0 3px 8px rgba(0,0,0,.45); }
  #panel { width:280px; background:var(--panel); padding:14px; overflow-y:auto; border-left:1px solid #222; }
  h1 { font-size:13px; margin:0 0 10px; letter-spacing:.08em; text-transform:uppercase; }
  h2 { font-size:11px; margin:14px 0 6px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; font-weight:400;
    border-top:1px solid #242424; padding-top:10px; }
  .row { display:grid; grid-template-columns: 84px 1fr 40px; align-items:center; gap:6px; margin:4px 0; }
  .row label { color:var(--dim); }
  .row output { text-align:right; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  input[type=text], select { width:100%; background:#0c0c0c; color:var(--fg); border:1px solid #333; padding:4px 6px; font:inherit; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  button { flex:1; background:#222; color:var(--fg); border:1px solid #333; padding:7px 8px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.on { border-color:var(--acc); color:var(--acc); }
  #status { color:var(--dim); margin-top:10px; min-height:1.4em; font-size:11px; }
  .hint { color:#555; margin-top:12px; }
  @media (max-width: 700px) {
    body { flex-direction:column; height:auto; }
    #stage { flex:none; height:72vh; }
    #panel { width:100%; border-left:0; border-top:1px solid #222; }
  }

<script>
// ---------- rng ----------
function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
  return (h ^ h >>> 16) >>> 0;
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// weighted pick driven by a single roll in [0,1)
function wp(v, items, ws) {
  let s = 0; for (const w of ws) s += w;
  v *= s;
  for (let i = 0; i < items.length; i++) if ((v -= ws[i]) < 0) return items[i];
  return items[items.length - 1];
}
function rngFrom(a) {
  const n = mulberry32(a);
  const r = () => n();
  r.range = (x, y) => x + (y - x) * n();
  r.int = (x, y) => x + Math.floor(n() * (y - x + 1));
  r.pick = arr => arr[Math.floor(n() * arr.length)];
  r.chance = p => n() < p;
  r.wpick = (items, ws) => wp(n(), items, ws);
  r.sub = () => rngFrom((n() * 4294967296) >>> 0);   // independent stream, costs one roll
  return r;
}
const makeRng = s => rngFrom(hashStr(s));
const randSeed = () => Math.random().toString(36).slice(2, 8);
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function hash1(i) {
  let h = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise2(x, y, sd) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const h = (i, j) => hash1((Math.imul(i, 73856093) ^ Math.imul(j, 19349663)) + sd);
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(h(xi, yi), h(xi + 1, yi), u), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), u), v);
}
// periodic value noise (period N) for closed outlines
function pnoise(x, N, sd) {
  const i = Math.floor(x), f = x - i, t = f * f * (3 - 2 * f), m = k => ((k % N) + N) % N;
  return lerp(hash1(m(i) * 7 + sd), hash1(m(i + 1) * 7 + sd), t) * 2 - 1;
}

// ---------- params ----------

    hand: { black: 2, red: 2, white: 2, yellow: 1, blue: 1 },
    leg: { black: 2, red: 2, white: 2, yellow: 1.5, blue: 1.5 },
    field: { red: 3, yellow: 3, blue: 3, black: 2, white: 2.5 },

const PAL_NAMES = { auto: 'авто', ...Object.fromEntries(Object.entries(PALS).map(([k, v]) => [k, v.name])) };
const HAIR = { black: 3, red: 1.4, orange: 1.1, brown: 1, yellow: 0.7, white: 0.4, grey: 0.4 };
const HEAD2 = { white: 2, red: 2, black: 2, blue: 1, grey: 0.8, yellow: 0.5 };
const SCARF = { white: 3, red: 1, black: 1, blue: 0.6, yellow: 0.4 };
const NECK = { red: 3, black: 2, blue: 2, white: 1, grey: 1, yellow: 0.5 };
const ACC = { red: 3, black: 2.5, blue: 2, yellow: 1.2, white: 1, orange: 1, green: 0.8 };
const GRIDC = { blue: 2.5, navy: 1.4, green: 2.5, cream: 2, grey: 1.4, yellow: 1.5, pink: 1.1, red: 0.7, black: 0.7, sky: 1, ivory: 1, teal: 0.8 };
const VSTRIPE = { white: 2, ochre: 2, black: 2, green: 1.4, cream: 1, red: 0.6, teal: 1, sky: 0.6 };

const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const mix = (h1, h2, t) => { const a = rgb(h1), b = rgb(h2);
  return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); };
const lumOf = h => { const [r, g, b] = rgb(h); return (0.3 * r + 0.59 * g + 0.11 * b) / 255; };
const cdist = (a, b) => { const x = rgb(a), y = rgb(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]); };
const nearNames = names => Object.keys(PIG).filter(k => names.some(n =>
  cdist(PIG[k], PIG[n]) < 95 || (lumOf(PIG[k]) < 0.2 && lumOf(PIG[n]) < 0.2)));
const reddish = h => { const [r, g, b] = rgb(h); return r > 150 && g < 140 && b < 150; };
// pigment name by weights, one roll, skipping avoided names
function pc(roll, w, avoid = []) {
  let s = 0, last = null;
  for (const k in w) if (!avoid.includes(k)) { s += w[k]; last = k; }
  if (!last) return Object.keys(w)[0];
  let v = roll * s;
  for (const k in w) { if (avoid.includes(k)) continue; if ((v -= w[k]) < 0) return k; }
  return last;
}

// ---------- geometry ----------
const rectPts = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
const half = (x, side) => side > 0 ? [x, -1e4, 1e4, 1e4] : [-1e4, -1e4, x, 1e4];
const isect = (a, b) => [Math.max(a[0], b[0]), Math.max(a[1], b[1]), Math.min(a[2], b[2]), Math.min(a[3], b[3])];
function bbox(pts) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return [x0, y0, x1, y1];
}
function rot(pts, cx, cy, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return pts.map(([x, y]) => [cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c]);
}
function inPoly(pts, x, y) {
  let ins = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
// polygon with filleted corners (radius per vertex)
function rpoly(pts, r = 0, step = 3) {
  const n = pts.length, out = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i], ri = Array.isArray(r) ? r[i] || 0 : r;
    if (ri <= 0) { out.push(p); continue; }
    const a = pts[(i + n - 1) % n], b = pts[(i + 1) % n];
    let ax = a[0] - p[0], ay = a[1] - p[1], bx = b[0] - p[0], by = b[1] - p[1];
    const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
    if (la < 1e-6 || lb < 1e-6) { out.push(p); continue; }
    ax /= la; ay /= la; bx /= lb; by /= lb;
    const ang = Math.acos(clamp(ax * bx + ay * by, -1, 1));
    if (ang < 1e-3 || ang > Math.PI - 1e-3) { out.push(p); continue; }
    const tn = Math.tan(ang / 2), t = Math.min(ri / tn, la * 0.5, lb * 0.5), rr = t * tn;
    const hx = ax + bx, hy = ay + by, hl = Math.hypot(hx, hy), d = rr / Math.sin(ang / 2);
    const cx = p[0] + hx / hl * d, cy = p[1] + hy / hl * d;
    const a0 = Math.atan2(p[1] + ay * t - cy, p[0] + ax * t - cx);
    let da = Math.atan2(p[1] + by * t - cy, p[0] + bx * t - cx) - a0;
    while (da > Math.PI) da -= 2 * Math.PI;
    while (da < -Math.PI) da += 2 * Math.PI;
    const k = Math.max(2, Math.ceil(Math.abs(da) * rr / step));
    for (let j = 0; j <= k; j++) { const q = a0 + da * j / k; out.push([cx + Math.cos(q) * rr, cy + Math.sin(q) * rr]); }
  }
  return out;
}
function egg(cx, cy, rx, ry, k = 0, n = 96) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i / n * Math.PI * 2, s = Math.sin(t);
    out.push([cx + rx * Math.cos(t) * (1 - k * s), cy + ry * s]);

  return out;
}
// hand-painted outline: densify, then push along the normal by periodic noise
function wob(pts, amp, sd) {
  if (amp <= 0) return pts;
  const d = [], n0 = pts.length;
  for (let i = 0; i < n0; i++) {
    const a = pts[i], b = pts[(i + 1) % n0];
    const k = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 5));
    for (let j = 0; j < k; j++) d.push([lerp(a[0], b[0], j / k), lerp(a[1], b[1], j / k)]);
  }
  const n = d.length, cum = [0];
  for (let i = 1; i <= n; i++) cum.push(cum[i - 1] + Math.hypot(d[i % n][0] - d[i - 1][0], d[i % n][1] - d[i - 1][1]));
  const per = cum[n];
  if (per < 4) return d;
  amp = Math.min(amp, per * 0.008);
  const N1 = Math.max(2, Math.round(per / 60)), N2 = Math.max(3, Math.round(per / 13));
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = d[(i + n - 1) % n], b = d[(i + 1) % n];
    const nx = b[1] - a[1], ny = a[0] - b[0], nl = Math.hypot(nx, ny) || 1, s = cum[i] / per;
    const o = amp * (pnoise(s * N1, N1, sd) * 0.85 + pnoise(s * N2, N2, sd + 3) * 0.3);
    out.push([d[i][0] + nx / nl * o, d[i][1] + ny / nl * o]);

}
function zigzag(x0, x1, y0, bh, th, n) {
  const pts = [[x0, y0], [x1, y0]];

  const M = ([x, y]) => [hx + x * d, hy + y];

    .map(([x, y]) => [fx + x * d * k, fy + y * k]);

const SHOE_R = [0.03, 0.03, 0.08, 0.1, 0.1, 0.12];
function almond(ex, ey, w, h) {
  const pts = [], n = 14;
  for (let i = 0; i <= n; i++) { const t = -1 + 2 * i / n; pts.push([ex + t * w / 2, ey - h / 2 * (1 - t * t)]); }
  for (let i = n - 1; i > 0; i--) { const t = -1 + 2 * i / n; pts.push([ex + t * w / 2, ey + h / 2 * 0.8 * (1 - t * t)]); }
  return pts;
}
function lid(ex, ey, w, h) {
  const pts = [], n = 14;
  for (let i = 0; i <= n; i++) { const t = -1 + 2 * i / n; pts.push([ex + t * w / 2, ey - h / 2 * (1 - t * t)]); }
  for (let i = n; i >= 0; i--) { const t = -1 + 2 * i / n;
    pts.push([ex + t * w / 2 * 0.92, ey - h / 2 * (1 - t * t) + h * 0.2 * Math.sqrt(1 - t * t)]); }
  return pts;

// ---------- fills ----------
const lin = (x0, y0, x1, y1, stops) => ({ lin: [x0, y0, x1, y1], stops });
const rad = (x0, y0, r0, x1, y1, r1, stops) => ({ rad: [x0, y0, r0, x1, y1, r1], stops });
// colour c solid until a, sprayed out by b, along direction ang across the box
function fadeF(bb, c, ang, a, b) {
  const mx = (bb[0] + bb[2]) / 2, my = (bb[1] + bb[3]) / 2, dx = Math.cos(ang), dy = Math.sin(ang);
  const h = (Math.abs(dx) * (bb[2] - bb[0]) + Math.abs(dy) * (bb[3] - bb[1])) / 2;
  b = Math.min(1, b);
  return lin(mx - dx * h, my - dy * h, mx + dx * h, my + dy * h, [[0, c, 1], [a, c, 1], [(a + b) / 2, c, 0.42], [b, c, 0]]);

  const hz = S.DH * B.range(0.78, 0.9), sk = sky(B.sub(), pal, hz, 'grad'), Q = B.sub();
  stripesV(B.sub(), lay, -30, hz + 3);
  const n = Q.int(1, 3);
  let y = hz, prev = null;
  for (let i = 0; i < n; i++) {
    const h = i === n - 1 ? S.DH + 40 - y : (S.DH - hz) * Q.range(0.15, 0.4);
    const c = pc(Q(), { ochre: 2, teal: 1.5, cream: 1.2, green: 1, black: 0.5, sky: 0.8, white: 0.8 }, prev ? [prev] : []);
    add(rectPts(-30, y, S.DW + 30, y + h + 2), PIG[c], { ang: 0.02, aj: 0.3 });
    y += h; prev = c;
  }
  return sk.avoid;
}

// ---------- composition ----------
function buildScene(seed) {
  const R = makeRng(seed), rc = R(), rp = R(), rf = R(), rb = R();
  const comp = P.comp !== 'auto' ? P.comp : wp(rc, ['head', 'bust', 'torso', 'figure', 'group'], [1.1, 2, 2, 3, 2]);
  const palK = P.pal !== 'auto' ? P.pal : wp(rp, ['peasant', 'sport', 'late', 'primary'],
    { head: [3, 1, 2.5, 1.5], bust: [3, 1, 2.5, 1.5], torso: [3, 1.5, 1.5, 1.5], figure: [3, 1.5, 1, 1.5], group: [3, 3, 0.5, 1.5] }[comp]);
  const pal = PALS[palK];
  const n = comp === 'group' ? P.count : 1;
  const fk = P.format !== 'auto' ? P.format : wp(rf, ...({
    head: [['p23', 'p34'], [1, 1]], bust: [['p34', 'p45'], [1.4, 1]], torso: [['p34', 'p45', 'p23'], [1.4, 1, 0.8]],
    figure: [['p23', 'p34', 'p35', 'a'], [1, 1, 0.6, 0.8]], group: n <= 2 ? [['p45', 'sq'], [1, 1]] : [['w65', 'w43'], [1, 1]],
  }[comp]));
  const bgK = P.bg !== 'auto' ? P.bg : wp(rb, ['flat', 'fields', 'persp', 'grid', 'stripes'], {
    head: [2, 3, 0.5, 1, 0.6], bust: [3, 3, 0.5, 1, 2], torso: [3, 1, 0.3, 2, 1],
    figure: [1, 4, 2, 0.3, 1], group: [1, 4, 1, 0.3, 1] }[comp]);
  const DW = 1000, DH = Math.round(DW / FORMATS[fk][1]);
  S = { DW, DH, ops: [], n: 0, sd: hashStr(seed), hzAt: () => DH * 0.5,
    info: `${COMPS[comp]} · ${BGS[bgK]} · ${pal.name} · ${FORMATS[fk][0]}` };

  // layout
  const kind = { head: 'head', bust: 'bust', torso: 'torso', figure: 'full', group: 'full' }[comp];
  const Lr = makeRng(seed + ':lay'), g = proportions(makeRng(seed + ':g'), kind), total = figTotal(g);
  const figs = [];
  let hz;
  if (comp === 'head') {
    const u = Math.min(DH * Lr.range(0.4, 0.48), DW * 0.62 / g.hw);
    figs.push({ cx: DW * (0.5 + Lr.range(-0.03, 0.03)), top: DH * Lr.range(0.07, 0.13), u, g });
    hz = DH * Lr.range(0.38, 0.62);
  } else if (comp === 'bust' || comp === 'torso') {
    const bust = comp === 'bust';
    const u = bust ? Math.min(DH * Lr.range(0.19, 0.26), DW * 0.86 / (2 * g.sh + 0.3))

    const top = DH * (bust ? Lr.range(0.1, 0.2) : Lr.range(0.05, 0.1));
    figs.push({ cx: DW * (0.5 + Lr.range(-0.05, 0.05)), top, u, g });
    hz = clamp(top + u * (1 + g.neck + Lr.range(-0.3, 2.2)), DH * 0.35, DH * 0.85);
  } else if (comp === 'figure') {
    const halfW = Math.max(g.sh + g.spread + 0.2, g.lower === 'skirt' ? g.skirtW + 0.1 : 0);
    const u = Math.min(DH * Lr.range(0.8, 0.9) / total, DW * 0.84 / (2 * halfW));
    figs.push({ cx: DW * (0.5 + Lr.range(-0.07, 0.07)), top: DH * (1 - Lr.range(0.03, 0.08)) - total * u, u, g, tool: Lr() < 0.2 });
    hz = DH * Lr.range(0.3, 0.62);
  } else {
    if (g.lower === 'skirt') g.skirtW = Math.min(g.skirtW, 1.4);
    const slot = DW * 0.96 / n, halfW = Math.max(g.sh + g.spread + 0.12 + g.aw * 0.5, g.lower === 'skirt' ? g.skirtW : 0);
    const u = Math.min(slot / (2 * halfW * 0.85), DH * Lr.range(0.78, 0.88) / total);
    const bottom = DH * (1 - Lr.range(0.03, 0.07));
    for (let i = 0; i < n; i++) {
      const gi = jitterG(g, makeRng(seed + ':j' + i));
      figs.push({ cx: DW * 0.02 + slot * (i + 0.5), top: bottom - figTotal(gi) * u, u, g: gi });
    }
    hz = DH * Lr.range(0.3, 0.72);
  }
  for (const f of figs) f.flip = Lr() < 0.5;
  const lay = { hz, figs, comp };

  // background
  const B = makeRng(seed + ':bg');
  const avoid = nearNames({ flat: bgFlat, fields: bgFields, persp: bgPersp, grid: bgGrid, stripes: bgStripes }[bgK](B, pal, lay));

  // distant little people standing on the fields
  if (comp === 'figure' && (bgK === 'fields' || bgK === 'persp') && Lr() < 0.35) {
    const f = figs[0], k = Lr.int(1, 2);
    for (let i = 0; i < k; i++) {
      const side = i ? -1 : Lr() < 0.5 ? -1 : 1, cx = f.cx + side * DW * Lr.range(0.26, 0.38);
      if (cx < DW * 0.06 || cx > DW * 0.94) continue;
      const gs = proportions(makeRng(seed + ':sg' + i), 'full'), us = f.u * Lr.range(0.22, 0.36);
      const foot = S.hzAt(cx) + (DH - S.hzAt(cx)) * Lr.range(0.04, 0.16);
      figure(makeRng(seed + ':s' + i), { cx, top: foot - figTotal(gs) * us, u: us, g: gs, kind: 'full', pal, small: true, flip: Lr() < 0.5 });
    }
  }
  figs.forEach((f, i) => figure(makeRng(seed + ':f' + i), { ...f, kind, pal, avoid }));
  return S;
}

// ---------- render ----------
function style(ctx, f) {
  if (typeof f === 'string') return f;
  const g = f.lin ? ctx.createLinearGradient(...f.lin) : ctx.createRadialGradient(...f.rad);
  for (const [t, c, a] of f.stops) g.addColorStop(clamp(t), rgba(c, a ?? 1));
  return g;
}
function toPath(pts) {
  const p = new Path2D();
  p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
  p.closePath();
  return p;
}
const BUCKETS = [[1.1, '255,255,255', 0.11], [1.1, '0,0,0', 0.09], [2.3, '255,255,255', 0.075],
  [2.3, '0,0,0', 0.07], [4.2, '255,255,255', 0.05], [4.2, '0,0,0', 0.05]];
// directional brush strokes, soft-light, clipped to the shape
function strokes(ctx, op, sd) {
  const [x0, y0, x1, y1] = vis(op.bb), w = x1 - x0, h = y1 - y0;
  if (w <= 0 || h <= 0) return;
  const n = Math.min(14000, w * h / 70 * P.brush * op.br) | 0;
  if (n < 6) return;
  const r = mulberry32(sd);
  ctx.globalCompositeOperation = 'soft-light';
  ctx.lineCap = 'round';
  for (const [lw, col, a] of BUCKETS) {
    ctx.beginPath();
    for (let j = 0; j < n / BUCKETS.length; j++) {
      const x = x0 + r() * w, y = y0 + r() * h, an = op.ang + (r() - 0.5) * op.aj * Math.PI / 2;
      const L = 6 + r() * r() * 30, dx = Math.cos(an) * L / 2, dy = Math.sin(an) * L / 2, b = (r() - 0.5) * 0.3;
      ctx.moveTo(x - dx, y - dy);
      ctx.quadraticCurveTo(x - dy * b, y + dx * b, x + dx, y + dy);
    }
    ctx.lineWidth = lw; ctx.strokeStyle = `rgba(${col},${a})`;
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function paintOp(ctx, op, sd) {
  const path = toPath(op.pts), [x0, y0, x1, y1] = op.bb;
  ctx.save();
  ctx.clip(path);
  for (const L of op.L) {
    const cl = L.rect || L.poly;
    if (cl) { ctx.save(); const p = L.poly ? toPath(L.poly) : new Path2D(); if (L.rect) p.rect(L.rect[0], L.rect[1], L.rect[2] - L.rect[0], L.rect[3] - L.rect[1]); ctx.clip(p); }
    ctx.fillStyle = style(ctx, L.f);
    ctx.fillRect(x0 - 2, y0 - 2, x1 - x0 + 4, y1 - y0 + 4);
    if (cl) ctx.restore();
  }
  if (P.brush > 0 && op.br > 0) strokes(ctx, op, sd);
  if (op.edge) {
    ctx.globalCompositeOperation = 'multiply';
    ctx.lineWidth = 2.4; ctx.strokeStyle = rgba('#2a1d12', op.edge); ctx.stroke(path);
    ctx.globalCompositeOperation = 'source-over';
  }

}
// Voronoi craquelure: edges drawn where the paint is dark or the crack field is strong
function craquelure(ctx, sc) {
  const k = P.cracks;
  if (k <= 0) return;
  const { DW, DH } = sc, lw = 200, lh = Math.max(1, Math.round(lw * DH / DW));
  const lc = document.createElement('canvas'); lc.width = lw; lc.height = lh;
  const lx = lc.getContext('2d', { willReadFrequently: true });
  lx.drawImage(ctx.canvas, 0, 0, lw, lh);
  const ld = lx.getImageData(0, 0, lw, lh).data;
  const lumAt = (x, y) => { const i = (clamp(Math.floor(y / DH * lh), 0, lh - 1) * lw + clamp(Math.floor(x / DW * lw), 0, lw - 1)) * 4;
    return (ld[i] * 0.3 + ld[i + 1] * 0.59 + ld[i + 2] * 0.11) / 255; };
  const r = mulberry32(sc.sd ^ 0x5bd1e995), cs = 13, csy = 19, nx = Math.ceil(DW / cs) + 3, ny = Math.ceil(DH / csy) + 3;
  const site = new Float64Array(nx * ny * 2);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const q = (j * nx + i) * 2;
    site[q] = (i - 1 + 0.12 + 0.76 * r()) * cs; site[q + 1] = (j - 1 + 0.12 + 0.76 * r()) * csy;
  }
  const dark = new Path2D(), light = new Path2D(), sd = sc.sd & 0xffff;
  for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
    const id = j * nx + i, px = site[id * 2], py = site[id * 2 + 1];
    const bw = 3 * csy;
    let poly = [[px - bw, py - bw, -1], [px + bw, py - bw, -1], [px + bw, py + bw, -1], [px - bw, py + bw, -1]];
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const nid = (j + dj) * nx + i + di, qx = site[nid * 2], qy = site[nid * 2 + 1];
      const mx = (px + qx) / 2, my = (py + qy) / 2, dx = qx - px, dy = qy - py;
      const out = [];
      for (let e = 0; e < poly.length; e++) {
        const a = poly[e], b = poly[(e + 1) % poly.length];
        const sa = (a[0] - mx) * dx + (a[1] - my) * dy, sb = (b[0] - mx) * dx + (b[1] - my) * dy;
        if (sa <= 0) {
          out.push(a);
          if (sb > 0) { const t = sa / (sa - sb); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, nid]); }
        } else if (sb <= 0) { const t = sa / (sa - sb); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2]]); }
      }
      poly = out;
    }
    for (let e = 0; e < poly.length; e++) {
      const a = poly[e], lab = a[2];
      if (lab <= id) continue;                 // each shared edge once
      const b = poly[(e + 1) % poly.length], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      if (mx < -2 || my < -2 || mx > DW + 2 || my > DH + 2) continue;
      // patches of connected network: a smooth field thresholded by amount and paint darkness
      const L = lumAt(mx, my);
      const fld = vnoise2(mx / 260, my / 260, sd) * 0.65 + vnoise2(mx / 70, my / 70, sd + 9) * 0.35;
      const th = 0.9 - k * 0.6 - (1 - L) * 0.2;
      if (fld < th + (hash1(id * 131 + lab * 7 + sd) - 0.5) * 0.07 || hash1(id * 29 + lab * 3 + sd) < 0.1) continue;
      const jt = (hash1(id * 17 + lab) - 0.5) * 0.35;
      const path = L < 0.42 ? light : dark;
      path.moveTo(a[0], a[1]);
      path.lineTo(mx + (b[1] - a[1]) * jt, my - (b[0] - a[0]) * jt);
      path.lineTo(b[0], b[1]);

  }

  ctx.globalCompositeOperation = 'multiply'; ctx.strokeStyle = 'rgba(80,58,34,0.36)'; ctx.stroke(dark);
  ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = 'rgba(228,220,200,0.33)'; ctx.stroke(light);
}
let weaveCache = null;
function weaveTile(s) {
  const per0 = Math.max(2.2, 2.8 * s), m = 2 * Math.max(4, Math.round(96 / per0)), TS = Math.round(per0 * m), per = TS / m;
  if (weaveCache && weaveCache.TS === TS) return weaveCache.c;
  const c = document.createElement('canvas'); c.width = c.height = TS;
  const g = c.getContext('2d'), im = g.createImageData(TS, TS), d = im.data, r = mulberry32(12345);
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const u = x / per, v = y / per, cu = Math.floor(u), cv = Math.floor(v), par = (cu + cv) & 1;
    const across = par ? u - cu : v - cv, along = par ? v - cv : u - cu;
    const val = 0.5 + 0.22 * (Math.sin(across * Math.PI) * (0.75 + 0.25 * Math.sin(along * Math.PI)) - 0.6) + (r() - 0.5) * 0.18;
    const i = (y * TS + x) * 4;
    d[i] = d[i + 1] = d[i + 2] = clamp(val) * 255; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);

}
// canvas weave, paint mottling, yellowed varnish, vignette
function finish(ctx, sc, s) {
  const k = P.canvas;
  if (k <= 0) return;
  const W = ctx.canvas.width, H = ctx.canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = Math.min(1, 0.6 * k);
  ctx.fillStyle = ctx.createPattern(weaveTile(s), 'repeat'); ctx.fillRect(0, 0, W, H);
  const mw = 64, mh = Math.round(64 * H / W), mc = document.createElement('canvas'); mc.width = mw; mc.height = mh;
  const mg = mc.getContext('2d'), im = mg.createImageData(mw, mh);
  for (let i = 0; i < mw * mh; i++) { const v = 128 + (hash1(i + sc.sd) - 0.5) * 110; im.data.set([v, v, v, 255], i * 4); }
  mg.putImageData(im, 0, 0);
  ctx.globalAlpha = 0.3 * k; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(mc, 0, 0, W, H);

  const gr = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.56);
  gr.addColorStop(0, 'rgba(110,85,50,0)'); gr.addColorStop(1, `rgba(110,85,50,${0.32 * k})`);

function render(ctx, sc, s) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = PIG.white; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(s, 0, 0, s, 0, 0);
  sc.ops.forEach((op, i) => paintOp(ctx, op, (sc.sd + i * 7919) >>> 0));
  craquelure(ctx, sc);

// ---------- ui ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), seedInp = document.getElementById('seed'), status = document.getElementById('status');
let seed = randSeed(), scene = null, auto = null, pend = false;

function regen() {
  const t0 = performance.now();
  scene = buildScene(seed);
  draw();
  status.textContent = `${scene.info} · ${Math.round(performance.now() - t0)} ms`;
}
function regenSoon() { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; regen(); }); }
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const aw = (stage.clientWidth - 40) * dpr, ah = (stage.clientHeight - 40) * dpr;
  const s = Math.max(0.2, Math.min(aw / scene.DW, ah / scene.DH));
  cv.width = Math.round(scene.DW * s); cv.height = Math.round(scene.DH * s);
  cv.style.width = cv.width / dpr + 'px'; cv.style.height = cv.height / dpr + 'px';
  render(ctx, scene, s);
}
function newPeople() { seed = randSeed(); seedInp.value = seed; regen(); }
function save() {
  const c = document.createElement('canvas');
  c.width = scene.DW * 2; c.height = scene.DH * 2;
  render(c.getContext('2d'), scene, 2);
  const a = document.createElement('a');
  a.download = `suprematist-${seed.replace(/[^\w-]/g, '_')}.png`;
  a.href = c.toDataURL('image/png'); a.click();
}
function toggleAuto() {
  if (auto) { clearInterval(auto); auto = null; } else auto = setInterval(newPeople, 2600);
  document.getElementById('bAuto').classList.toggle('on', !!auto);
}

const box = document.getElementById('controls');
for (const [k, label, min, max, step] of CTRL) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${P[k]}"><output>${P[k]}</output>`;
  const inp = row.querySelector('input'), out = row.querySelector('output');
  inp.oninput = () => { P[k] = +inp.value; out.textContent = P[k]; regenSoon(); };
  box.appendChild(row);
}
const sels = {};
for (const [id, opts] of [['comp', COMPS], ['bg', BGS], ['pal', PAL_NAMES], ['format', FORMATS]]) {
  const sel = sels[id] = document.getElementById(id);
  for (const [k, v] of Object.entries(opts)) sel.add(new Option(Array.isArray(v) ? v[0] : v, k, false, k === P[id]));
  sel.onchange = () => { P[id] = sel.value; regen(); };
}
function cycle(id) {
  const sel = sels[id];
  sel.selectedIndex = (sel.selectedIndex + 1) % sel.options.length;
  sel.onchange();
}

seedInp.value = seed;
seedInp.onchange = () => { seed = seedInp.value; regen(); };
document.getElementById('bNew').onclick = newPeople;
document.getElementById('bDice').onclick = newPeople;
document.getElementById('bAuto').onclick = toggleAuto;
document.getElementById('bSave').onclick = save;
cv.addEventListener('click', newPeople);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); newPeople(); }
  else if (e.code === 'KeyR') newPeople();
  else if (e.code === 'KeyS') save();
  else if (e.code === 'KeyA') toggleAuto();
  else if (e.code === 'KeyC') cycle('comp');
  else if (e.code === 'KeyB') cycle('bg');
  else if (e.code === 'KeyP') cycle('pal');
});
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 80); });
regen();
</script>
